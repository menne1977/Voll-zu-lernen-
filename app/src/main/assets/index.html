<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Voll zu lernen</title>
<style>
:root{--bg:#f4f1ff;--card:#fff;--ink:#241b4b;--mute:#6b6590;--pri:#4f46e5;--pri2:#7c3aed;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--line:#e4defa}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:760px;margin:0 auto;padding:16px 16px 48px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header.top h1{font-size:1.35rem;margin:0;flex:1}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap}
button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:14px;padding:14px 22px;font-weight:700;font-size:1.05rem;box-shadow:0 4px 0 #3730a3}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #3730a3}
.btn.ghost{background:#fff;color:var(--pri);border:2px solid var(--line);box-shadow:none}
.btn.small{padding:8px 14px;font-size:.95rem;box-shadow:none}
.back{background:none;border:0;color:var(--pri);font-weight:700;font-size:1rem;padding:6px 0}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:22px;padding:20px;margin-bottom:18px}
.hero h2{margin:0 0 4px;font-size:1.3rem}
.bar{height:12px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:#fde047;border-radius:99px;transition:width .4s}
h3.group{margin:22px 0 8px;font-size:1rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.topic{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.topic:hover{border-color:var(--pri)}
.topic .ic{font-size:2rem}
.topic b{font-size:1.05rem}
.stars{letter-spacing:2px;font-size:1.15rem}
.stars .off{opacity:.25;filter:grayscale(1)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px}
.card h2{margin:0 0 8px}
.explain p{margin:.5em 0}
.ex{background:#f5f3ff;border-left:5px solid var(--pri);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:1.05rem}
.q{font-size:1.45rem;font-weight:700;margin:6px 0 16px}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress>i{display:block;height:100%;background:var(--pri);transition:width .3s}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input.ans{font:inherit;font-size:1.5rem;font-weight:700;width:170px;padding:12px;border:3px solid var(--line);border-radius:14px;text-align:center}
input.ans:focus{outline:none;border-color:var(--pri)}
.unit{font-size:1.3rem;font-weight:700;color:var(--mute)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.choice{background:#fff;border:3px solid var(--line);border-radius:14px;padding:14px;font-size:1.2rem;font-weight:700}
.choice:hover:not(:disabled){border-color:var(--pri)}
.choice.right{background:var(--okbg);border-color:var(--ok)}
.choice.wrong{background:var(--badbg);border-color:var(--bad);opacity:.7}
.fb{border-radius:14px;padding:12px 16px;margin-top:14px;font-size:1.05rem}
.fb.ok{background:var(--okbg);color:#14532d}
.fb.bad{background:var(--badbg);color:#7f1d1d}
.fb.tip{background:var(--warnbg);color:#78350f}
.fb b{display:block;margin-bottom:2px}
.result{text-align:center}
.result .big{font-size:3.2rem;letter-spacing:6px;margin:8px 0}
.result .score{font-size:1.4rem;font-weight:700}
svg.chart{max-width:100%;height:auto;background:#fafaff;border:2px solid var(--line);border-radius:14px;margin-bottom:12px}
.clock{display:block;margin:0 auto 10px}
.spacer{height:10px}
.footer{color:var(--mute);font-size:.85rem;text-align:center;margin-top:28px}
.fr{display:inline-block;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px}
.fr sup,.fr sub{display:block;font-size:.8em;line-height:1.1}
.fr sup{border-bottom:2px solid currentColor;padding:0 4px}
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.cls{background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.cls b{font-size:1.5rem;line-height:1.1;text-align:center}
.cls small{color:var(--mute)}
.cls:hover{border-color:var(--pri)}
.topic{color:var(--ink);font:inherit}
#app{padding-bottom:96px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:2px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
#tabs button{flex:1;background:none;border:0;color:var(--mute);font-size:.72rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:12px}
#tabs button span{font-size:1.4rem;line-height:1.1}
#tabs button.on{color:var(--pri);background:#f0edff}
.helpbar{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.sel{font:inherit;font-weight:600;padding:10px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);max-width:100%}
.ta{display:block;width:100%;min-height:90px;margin:10px 0;font:inherit;padding:10px;border:2px solid var(--line);border-radius:12px;resize:vertical}
.resitem{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;color:var(--ink);font:inherit}
.resitem:hover{border-color:var(--pri)}
.resitem span{color:var(--mute);font-size:.9rem}
.sheet{position:fixed;inset:0;background:rgba(36,27,75,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheetbox{background:#fff;width:100%;max-width:760px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.sheetbox h3{margin:0 0 10px}
.sheetbtn{display:block;width:100%;text-align:left;background:#f7f5ff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font:inherit;font-weight:600;color:var(--ink)}
.subrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.subrow:last-child{border:0}
.reader p{margin:.6em 0;font-size:1.05rem}
.reader h3{margin:1.1em 0 .2em;color:var(--pri)}
body.lrs{font-family:Verdana,"Trebuchet MS",Tahoma,sans-serif;letter-spacing:.04em;word-spacing:.14em;line-height:1.75;--bg:#fbf4de}
body.lrs .q{font-size:1.5rem;line-height:1.8}body.lrs .choice,body.lrs .btn{font-size:1.15rem}body.lrs .card{background:#fffdf5}
.clz{font-size:1.15rem;background:#f5f3ff;border-radius:12px;padding:10px 12px;margin:8px 0}
.switch{display:flex;align-items:center;gap:10px;padding:10px 0;font-weight:700}.switch input{width:22px;height:22px}
body.dark{color-scheme:dark;--bg:#14122b;--card:#211d42;--ink:#ece9ff;--mute:#aaa4d6;--line:#3b3568;--okbg:#12361f;--badbg:#431a1a}
body.dark .pill,body.dark .btn.ghost,body.dark .choice,body.dark .cls,body.dark #tabs,body.dark .chip,body.dark .sel,body.dark .resitem,body.dark .sheetbox,body.dark input.ans,body.dark .topic{background:var(--card)!important;color:var(--ink)}
body.dark .ex,body.dark .clz,body.dark #tabs button.on{background:#2c2760!important}body.dark .chip.on{background:var(--pri)!important}
.wd{cursor:pointer;border-radius:6px}.wd:active{background:#fde68a}.sy0{color:#1d4ed8}.sy1{color:#b91c1c}body.dark .sy0{color:#93c5fd}body.dark .sy1{color:#fca5a5}
.mpanel{background:#fff;border:3px solid #111;border-radius:12px;padding:8px;margin:14px 0;position:relative}body.dark .mpanel{background:#2a2550}
.mnum{position:absolute;top:-10px;left:-6px;background:#111;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
.mcap{background:#fef08a;color:#222;border:2px solid #111;padding:8px 10px;margin:8px 0;font-weight:600;font-size:1.02rem;cursor:pointer}
.mbub{background:#fff;color:#111;border:2.5px solid #111;border-radius:20px;padding:10px 14px;margin:8px 0;max-width:88%;cursor:pointer;font-size:1.05rem;line-height:1.5}.mbub.l{margin-right:auto}.mbub.r{margin-left:auto;background:#e0f2fe}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs"></nav>
<script>
"use strict";

/* ---------- Hilfsfunktionen ---------- */
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=n=>String(n).replace(".",",");
const pad=n=>String(n).padStart(2,"0");
const hm=min=>{min=((min%1440)+1440)%1440;return pad(Math.floor(min/60))+":"+pad(min%60);};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const sg=n=>n<0?"−"+(-n):String(n);
const par=n=>n<0?`(−${-n})`:String(n);
const F=(n,d)=>`<span class="fr"><sup>${n}</sup>⁄<sub>${d}</sub></span>`;
const sup=e=>({2:"²",3:"³",4:"⁴"}[e]||"^"+e);
const r3=x=>Number(x.toFixed(4));
function poly(c,v){v=v||"x";let s="";const n=c.length-1;
  c.forEach((a,i)=>{const e=n-i;if(!a)return;const abs=Math.abs(a);let t=(abs===1&&e>0)?"":String(abs);if(e>0)t+=v+(e>1?sup(e):"");
    s+=s===""?(a<0?"−":"")+t:(a<0?" − ":" + ")+t;});
  return s||"0";}
const ROUNDS=10;
const money=x=>x.toFixed(2).replace(".",",");

/* ---------- Speicher (nur Komfort, darf fehlen) ---------- */
let store={};
try{store=JSON.parse(localStorage.getItem("lernwelt_v1")||"{}");}catch(e){store={};}
const save=()=>{try{localStorage.setItem("lernwelt_v1",JSON.stringify(store));}catch(e){}};
const skey=(id,k)=>id+"@"+k;
const starsOf=(id,k)=>(store[skey(id,k)]&&store[skey(id,k)].stars)||0;

/* ---------- Aufgaben-Generatoren (k = Klassenstufe, 0 = Vorschule) ---------- */
function parts(n){return{h:Math.floor(n/100)*100,t:Math.floor(n/10)%10*10,e:n%10};}

function genZaehlen(k){
  const n=rnd(1,k<=0?8:10),e=pick(["🍎","⭐","🐟","🎈","🐞","🌼"]);
  return{q:`Wie viele siehst du?<div style="font-size:2rem;margin:8px 0">${Array(n).fill(e).join(" ")}</div>`,type:"num",answer:n,
    hint:"Tippe mit dem Finger jedes Bild einmal an und zähle laut mit.",way:`Es sind ${n} Stück.`};
}
function genVergleich(k){
  const mx=k<=0?10:k==1?20:k==2?100:1000;
  const r=Math.random();
  const a=rnd(1,mx-1);
  if(r<.5){let b;do{b=rnd(1,mx);}while(b===a);
    return{q:`Welche Zahl ist größer: ${a} oder ${b}?`,type:"choice",choices:shuffle([String(a),String(b)]),answer:String(Math.max(a,b)),
      hint:"Die Zahl, die auf dem Zahlenstrahl weiter rechts steht, ist größer.",way:`${Math.max(a,b)} ist größer als ${Math.min(a,b)}.`};}
  if(r<.75)return{q:`Welche Zahl kommt direkt nach ${a}?`,type:"num",answer:a+1,hint:"Zähle einen Schritt weiter.",way:`Nach ${a} kommt ${a+1}.`};
  return{q:`Welche Zahl kommt direkt vor ${a+1}?`,type:"num",answer:a,hint:"Zähle einen Schritt zurück.",way:`Vor ${a+1} kommt ${a}.`};
}
function genPlusBig(){
  let a,b;
  if(Math.random()<.5){
    const h=rnd(1,6),t=rnd(0,8),e=rnd(0,8);a=h*100+t*10+e;
    b=rnd(0,Math.min(3,9-h))*100+rnd(0,9-t)*10+rnd(0,9-e);if(b<10)b=11;
  }else{a=rnd(120,780);b=rnd(35,Math.min(399,999-a));}
  const p=parts(b);let s=a,steps=[`${a}`];
  if(p.h){s+=p.h;steps.push(`+ ${p.h} = ${s}`);}
  if(p.t){s+=p.t;steps.push(`+ ${p.t} = ${s}`);}
  if(p.e){s+=p.e;steps.push(`+ ${p.e} = ${s}`);}
  return{q:`${a} + ${b} = ?`,type:"num",answer:a+b,
    hint:`Zerlege ${b} in Hunderter, Zehner und Einer und rechne Schritt für Schritt.`,
    way:`Rechne in Schritten: ${steps.join(" ")}.`};
}
function genPlus(k){
  if(k>=3)return genPlusBig();
  const mx=k<=0?10:k==1?20:100;
  const a=rnd(1,mx-1),b=rnd(1,mx-a);
  const t=Math.floor(b/10)*10,e=b%10;
  return{q:`${a} + ${b} = ?`,type:"num",answer:a+b,
    hint:mx>20?"Rechne erst die Zehner dazu, dann die Einer.":"Zähle von der größeren Zahl aus weiter oder zerlege die Zahlen.",
    way:mx>20&&t?`${a} + ${t} = ${a+t}, dann + ${e} = ${a+b}.`:`${a} + ${b} = ${a+b}.`};
}
function genMinusBig(){
  const a=rnd(200,999),b=rnd(21,Math.min(a-10,520));
  const p=parts(b);let s=a,steps=[`${a}`];
  if(p.h){s-=p.h;steps.push(`− ${p.h} = ${s}`);}
  if(p.t){s-=p.t;steps.push(`− ${p.t} = ${s}`);}
  if(p.e){s-=p.e;steps.push(`− ${p.e} = ${s}`);}
  return{q:`${a} − ${b} = ?`,type:"num",answer:a-b,
    hint:`Nimm erst die Hunderter weg, dann die Zehner, dann die Einer. Probe: Ergebnis + ${b}.`,
    way:`Rechne in Schritten: ${steps.join(" ")}.`};
}
function genMinus(k){
  if(k>=3)return genMinusBig();
  const mx=k<=0?10:k==1?20:100;
  const a=rnd(2,mx),b=rnd(1,a-1);
  const t=Math.floor(b/10)*10,e=b%10;
  return{q:`${a} − ${b} = ?`,type:"num",answer:a-b,
    hint:mx>20?"Nimm erst die Zehner weg, dann die Einer.":"Zähle zurück oder ergänze von der kleineren zur größeren Zahl.",
    way:mx>20&&t?`${a} − ${t} = ${a-t}, dann − ${e} = ${a-b}.`:`${a} − ${b} = ${a-b}.`};
}
function genMal(k){
  if(k<=2){const a=pick([2,5,10]),b=rnd(1,10);
    return{q:`${a} · ${b} = ?`,type:"num",answer:a*b,hint:`Zähle in ${a}er-Schritten: ${a}, ${2*a}, ${3*a} …`,way:`${b} mal die ${a}: ${a*b}.`};}
  if(Math.random()<.3){
    const a=rnd(2,9),b=rnd(2,9);
    return{q:`${a*10} · ${b} = ?`,type:"num",answer:a*10*b,
      hint:`Rechne erst ${a} · ${b} und häng dann eine Null an.`,
      way:`${a} · ${b} = ${a*b}. Weil ${a*10} ein Zehner-Wert ist, kommt eine Null dazu: ${a*10*b}.`};
  }
  const a=rnd(2,10),b=rnd(3,10);
  return{q:`${a} · ${b} = ?`,type:"num",answer:a*b,
    hint:`Rechne ${a} · ${b-1} und zähl noch ${a} dazu. Oder tausche die Zahlen: ${b} · ${a}.`,
    way:`${a} · ${b-1} = ${a*(b-1)}, dazu noch ${a}: ${a*(b-1)} + ${a} = ${a*b}.`};
}
function genGeteilt(k){
  const b=k<=2?pick([2,5,10]):rnd(2,10),c=rnd(k<=2?1:2,10),a=b*c;
  return{q:`${a} : ${b} = ?`,type:"num",answer:c,
    hint:`Frag dich: ${b} mal welche Zahl ergibt ${a}? Das ist die Umkehraufgabe.`,
    way:`Umkehraufgabe: ${b} · ${c} = ${a}. Also ist ${a} : ${b} = ${c}.`};
}
function genSchriftlich(k){
  if(Math.random()<.5){
    const a=k<=4?rnd(12,99):rnd(120,999),b=k<=4?rnd(3,9):rnd(11,45);
    const t=Math.floor(b/10)*10,e=b%10;
    return{q:`${a} · ${b} = ?`,type:"num",answer:a*b,
      hint:`Zerlege ${b}: rechne ${a} mal ${t?t+" und ":""}${a} mal ${e||b}, dann zähle zusammen.`,
      way:t?`${a}·${t} = ${a*t}, ${a}·${e} = ${a*e}. Zusammen: ${a*b}.`:`${a} · ${b} = ${a*b}.`};
  }
  const b=rnd(3,12),c=k<=4?rnd(11,99):rnd(25,300),a=b*c;
  return{q:`${a} : ${b} = ?`,type:"num",answer:c,
    hint:`Teile Schritt für Schritt (halbschriftlich) und mach die Probe mit ${b} · Ergebnis.`,
    way:`Probe: ${b} · ${c} = ${a}. Also ist ${a} : ${b} = ${c}.`};
}
function genRunden(k){
  const n=rnd(1000,k<=4?99999:999999),pl=pick([10,100,1000]);
  const a=Math.round(n/pl)*pl;
  const nm={10:"Zehner",100:"Hunderter",1000:"Tausender"}[pl];
  return{q:`Runde ${n} auf ${nm}.`,type:"num",answer:a,
    hint:`Schau auf die Ziffer direkt rechts der ${nm}-Stelle: 0 bis 4 abrunden, 5 bis 9 aufrunden.`,
    way:`${n} gerundet auf ${nm} ist ${a}.`};
}
function genGeld(k){
  if(k<=2){
    const p1=rnd(1,9)*5,p2=rnd(1,Math.min(9,Math.floor((95-p1)/5)))*5;
    if(Math.random()<.5)
      return{q:`Ein Stift kostet ${p1} Cent, ein Radiergummi ${p2} Cent. Wie viel Cent kosten beide zusammen?`,type:"num",unit:"Cent",answer:p1+p2,
        hint:"Zusammen heißt plus rechnen.",way:`${p1} + ${p2} = ${p1+p2} Cent.`};
    return{q:`Du kaufst etwas für ${p1+p2} Cent und bezahlst mit 1 € (100 Cent). Wie viel Cent bekommst du zurück?`,type:"num",unit:"Cent",answer:100-p1-p2,
      hint:"Rückgeld = bezahlt minus Preis.",way:`100 − ${p1+p2} = ${100-p1-p2} Cent.`};
  }
  const items=[["einen Apfel",20,60],["ein Eis",80,180],["einen Stift",35,90],["ein Heft",55,150],["eine Brezel",45,95],["einen Radiergummi",25,70]];
  const [x,y]=shuffle(items).slice(0,2);
  const p1=Math.round(rnd(x[1],x[2])/5)*5,p2=Math.round(rnd(y[1],y[2])/5)*5;
  if(Math.random()<.5){
    return{q:`Du kaufst ${x[0]} für ${p1} Cent und ${y[0]} für ${p2} Cent. Wie viel Cent musst du zahlen?`,
      type:"num",unit:"Cent",answer:p1+p2,hint:`Zusammen kaufen heißt: plus rechnen.`,
      way:`${p1} + ${p2} = ${p1+p2} Cent (das sind ${money((p1+p2)/100)} €).`};
  }
  const pay=Math.ceil((p1+p2)/100)*100+(Math.random()<.4?100:0);
  return{q:`Du kaufst ${x[0]} für ${p1} Cent und ${y[0]} für ${p2} Cent und gibst ${pay/100} € (${pay} Cent). Wie viel Cent bekommst du zurück?`,
    type:"num",unit:"Cent",answer:pay-p1-p2,
    hint:`Rechne erst aus, was alles kostet. Dann: bezahlt − Preis = Rückgeld.`,
    way:`Preis: ${p1} + ${p2} = ${p1+p2} Cent. Rückgeld: ${pay} − ${p1+p2} = ${pay-p1-p2} Cent.`};
}
function genLaenge(k){
  if(k<=2){
    if(Math.random()<.5){const v=rnd(1,5);return{q:`${v} m = ? cm`,type:"num",unit:"cm",answer:v*100,hint:"1 m sind 100 cm.",way:`${v} · 100 = ${v*100} cm.`};}
    const v=rnd(1,5);return{q:`${v*100} cm = ? m`,type:"num",unit:"m",answer:v,hint:"100 cm sind 1 m.",way:`${v*100} : 100 = ${v} m.`};
  }
  const t=pick([["m","cm",100],["km","m",1000],["cm","mm",10]]);
  const v=rnd(2,25);
  if(Math.random()<.6)return{q:`${v} ${t[0]} = ? ${t[1]}`,type:"num",unit:t[1],answer:v*t[2],

 {id:"schriftlich",ic:"🧮",name:"Malnehmen und Teilen mit großen Zahlen",group:0,from:4,to:6,gen:genSchriftlich,explain:`<p><b>Halbschriftlich</b> multiplizieren: zerlege eine Zahl. <b>Teilen</b>: Schritt für Schritt, am Ende die Probe mit Malnehmen.</p><div class="ex">36 · 14 = 36·10 + 36·4 = 360 + 144 = <b>504</b></div>`},
 {id:"runden",ic:"🎯",name:"Runden",group:0,from:3,to:6,gen:genRunden,explain:`<p>Schau auf die Ziffer <b>rechts</b> der Stelle, auf die du rundest: 0–4 abrunden, 5–9 aufrunden.</p><div class="ex">3 478 auf Hunderter → Ziffer 7 → aufrunden → <b>3 500</b></div>`},
 {id:"brueche",ic:"🍕",name:"Brüche",group:0,from:5,to:8,gen:genBrueche,explain:`<p><b>Kürzen</b>: Zähler und Nenner durch dieselbe Zahl teilen. <b>Erweitern</b>: mit derselben Zahl malnehmen. Beim Addieren braucht man einen <b>gemeinsamen Nenner</b>. Beim Malnehmen: Zähler mal Zähler, Nenner mal Nenner. Teilen heißt mit dem <b>Kehrbruch</b> malnehmen.</p><div class="ex">1/2 + 1/3 = 3/6 + 2/6 = <b>5/6</b></div><p>Antworten als Bruch schreibst du mit Schrägstrich, zum Beispiel 5/6.</p>`},
 {id:"dezimal",ic:"🔹",name:"Dezimalzahlen",group:0,from:5,to:7,gen:genDezimal,explain:`<p>Beim Addieren und Subtrahieren stehen die <b>Kommas untereinander</b>. Mal 10, 100, 1000: das Komma wandert nach <b>rechts</b>, beim Teilen nach <b>links</b>.</p><div class="ex">2,45 · 100 = <b>245</b><br>1/4 = 1 : 4 = <b>0,25</b></div>`},
 {id:"prozent",ic:"💯",name:"Prozentrechnung und Zinsen",group:0,from:5,to:10,gen:genProzent,explain:`<p>1 % ist ein Hundertstel. <b>Prozentwert</b> = Grundwert · Prozentsatz. Von 1 % kannst du immer auf andere Prozente hochrechnen.</p><div class="ex">25 % von 80: 1 % = 0,8 → 25 · 0,8 = <b>20</b></div><p>Zinsen = Kapital · Zinssatz · Zeit in Jahren.</p>`},
 {id:"negativ",ic:"🌡️",name:"Negative Zahlen",group:0,from:5,to:8,gen:genNegativ,explain:`<p>Auf dem Zahlenstrahl gehen negative Zahlen nach <b>links</b>. Minus eine negative Zahl heißt <b>plus</b>. Beim Malnehmen und Teilen: gleiche Vorzeichen → <b>+</b>, verschiedene → <b>−</b>.</p><div class="ex">(−3) · (−4) = <b>12</b><br>5 − (−2) = 5 + 2 = <b>7</b></div><p>Du kannst auch „−“ mit der normalen Minustaste eingeben.</p>`},
 {id:"teilbar",ic:"🔑",name:"Teilbarkeit und Primzahlen",group:0,from:5,to:7,gen:genTeilbar,explain:`<p>Teilbarkeitsregeln: durch 2 (gerade), 3 (Quersumme), 5 (Endziffer 0/5), 9 (Quersumme), 10 (Endziffer 0). Eine <b>Primzahl</b> hat genau zwei Teiler. Der <b>ggT</b> ist der größte gemeinsame Teiler, das <b>kgV</b> das kleinste gemeinsame Vielfache.</p><div class="ex">ggT(12, 18) = 6, kgV(4, 6) = 12</div>`},
 {id:"dreisatz",ic:"⚖️",name:"Dreisatz",group:0,from:5,to:9,gen:genDreisatz,explain:`<p>Beim Dreisatz rechnest du erst auf <b>1</b> und dann auf die gewünschte Menge. Bei <b>je mehr, desto mehr</b> teilst du zuerst durch die gegebene Menge und nimmst dann mal die gesuchte Menge. Bei <b>je mehr, desto weniger</b> (umgekehrt) rechnest du die Gesamtmenge aus und teilst.</p><div class="ex">3 Hefte 4,50 € → 1 Heft 1,50 € → 5 Hefte <b>7,50 €</b></div>`},
 {id:"potenz",ic:"⬆️",name:"Potenzen und Wurzeln",group:0,from:7,to:13,gen:genPotenz,explain:`<p>aⁿ heißt: a genau n-mal mit sich selbst malnehmen. Gleiche Basis: Exponenten <b>addieren</b> beim Malnehmen. Negativer Exponent: Kehrwert. Die Wurzel ist die Umkehrung des Quadrierens.</p><div class="ex">2³ · 2⁴ = 2⁷, √49 = 7, 10^(−2) = 0,01</div>`},
 {id:"geld",ic:"💶",name:"Geld und Rückgeld",group:1,from:1,to:4,gen:genGeld,explain:`<p>1 € sind 100 Cent. Beim Einkaufen zählst du die Preise zusammen. Das <b>Rückgeld</b> ist bezahlt minus Preis.</p><div class="ex">Eis 120 Cent + Stift 45 Cent = 165 Cent<br>200 − 165 = <b>35 Cent</b> zurück</div>`},
 {id:"laenge",ic:"📏",name:"Längen umrechnen",group:1,from:1,to:6,gen:genLaenge,explain:`<p>Merke dir:</p><div class="ex">1 km = 1000 m<br>1 m = 100 cm<br>1 cm = 10 mm</div><p>Von der <b>großen</b> zur kleinen Einheit rechnest du <b>mal</b>, von klein zu groß <b>geteilt</b>.</p>`},
 {id:"gewicht",ic:"⚗️",name:"Gewichte und Hohlmaße",group:1,from:3,to:6,gen:genGewicht,explain:`<p>1 kg = 1000 g, 1 t = 1000 kg, 1 l = 1000 ml. Auch hier: große → kleine Einheit <b>mal 1000</b>, kleine → große <b>geteilt durch 1000</b>.</p><div class="ex">2,5 kg = 2,5 · 1000 = <b>2500 g</b></div>`},
 {id:"uhr",ic:"🕒",name:"Uhrzeit und Zeitspannen",group:1,from:1,to:4,gen:genUhr,explain:`<p>1 Stunde hat 60 Minuten. Der kurze Zeiger zeigt die Stunde, der lange die Minuten. Bei Zeitspannen gehst du bis zur <b>vollen Stunde</b> und rechnest dann den Rest.</p><div class="ex">14:40 + 50 Min.: bis 15:00 sind es 20 Min., noch 30 Min. → <b>15:30</b></div>`},
 {id:"geo",ic:"🔷",name:"Formen, Flächen und Körper",group:2,from:1,to:6,gen:genGeo,explain:`<p><b>Umfang</b> = alle Seiten zusammen. <b>Fläche</b> Rechteck = Länge · Breite, Dreieck = Grundseite · Höhe : 2. <b>Volumen</b> Quader = Länge · Breite · Höhe. Winkelsumme im Dreieck: 180°.</p><div class="ex">Rechteck 5 × 3 cm: Umfang <b>16 cm</b>, Fläche <b>15 cm²</b></div>`},
 {id:"pyth",ic:"📐",name:"Pythagoras und Winkelwerte",group:2,from:8,to:13,gen:genPyth,explain:`<p>Im rechtwinkligen Dreieck gilt <b>a² + b² = c²</b> (c ist die längste Seite, die Hypotenuse). Bekannte Zahlentripel: 3-4-5, 5-12-13, 8-15-17.</p><div class="ex">3² + 4² = 9 + 16 = 25 = 5²</div><p>Wichtige Winkelwerte: sin 30° = 0,5, cos 60° = 0,5, tan 45° = 1.</p>`},
 {id:"vektor",ic:"➡️",name:"Vektoren",group:2,from:11,to:13,gen:genVektor,explain:`<p><b>Skalarprodukt</b>: a·b = a₁b₁ + a₂b₂ + a₃b₃. Ist es 0, stehen die Vektoren <b>senkrecht</b> aufeinander. Die <b>Länge</b> ist √(a₁² + a₂² + a₃²).</p><div class="ex">(1|2|2): Länge √(1+4+4) = 3</div>`},
 {id:"diagramm",ic:"📊",name:"Diagramme und Mittelwert",group:3,from:2,to:6,gen:genDiagramm,explain:`<p>Bei einem Säulendiagramm gehst du von der Säulenspitze <b>waagerecht nach links</b> zur Zahlenleiste. Der <b>Mittelwert</b> ist die Summe aller Werte geteilt durch die Anzahl.</p><div class="ex">Mittelwert von 4, 8, 6 = 18 : 3 = <b>6</b></div>`},
 {id:"wahrsch",ic:"🎲",name:"Wahrscheinlichkeit und Zählen",group:3,from:3,to:13,gen:genWahrsch,explain:`<p><b>Wahrscheinlichkeit</b> = günstige Fälle : alle Fälle. Beim <b>Zählprinzip</b> multiplizierst du die Möglichkeiten. n! (n Fakultät) zählt die Reihenfolgen.</p><div class="ex">3 rote, 2 blaue Kugeln: P(rot) = <b>3/5</b></div>`},
 {id:"gleichung",ic:"⚙️",name:"Terme und Gleichungen",group:4,from:5,to:10,gen:genGleichung,explain:`<p>Bei einer Gleichung machst du auf <b>beiden Seiten</b> dasselbe: Gegenrechnung, bis x allein steht.</p><div class="ex">3x + 5 = 20<br>3x = 15 (−5)<br>x = <b>5</b> (:3)</div>`},
 {id:"lgs",ic:"🔗",name:"Lineare Gleichungssysteme",group:4,from:8,to:13,gen:genLGS,explain:`<p>Zwei Gleichungen, zwei Unbekannte. <b>Einsetzen</b>: eine Gleichung nach x oder y umstellen und in die andere einsetzen. <b>Additionsverfahren</b>: Gleichungen so multiplizieren, dass eine Variable beim Addieren wegfällt.</p><div class="ex">x + y = 5 und x − y = 1 → 2x = 6 → x = <b>3</b>, y = <b>2</b></div>`},
 {id:"quad",ic:"🌀",name:"Quadratische Gleichungen und Funktionen",group:4,from:9,to:13,gen:genQuad,explain:`<p>x² + px + q = 0 löst du mit der <b>pq-Formel</b>: x = −p/2 ± √((p/2)² − q). Der Term unter der Wurzel entscheidet über die Anzahl der Lösungen. Bei f(x) = ax² + bx + c liegt der Scheitelpunkt bei x = −b/(2a).</p><div class="ex">x² − 5x + 6 = 0 → Lösungen <b>2</b> und <b>3</b></div>`},
 {id:"linear",ic:"📈",name:"Lineare Funktionen",group:5,from:7,to:13,gen:genLinear,explain:`<p>f(x) = <b>m</b>x + <b>b</b>: m ist die Steigung, b der y-Achsenabschnitt. Steigung aus zwei Punkten: m = (y₂ − y₁) : (x₂ − x₁). Nullstelle: f(x) = 0 setzen.</p><div class="ex">f(x) = 2x − 6 → Nullstelle x = <b>3</b></div>`},
 {id:"ableit",ic:"∂",name:"Ableitung und Integral",group:5,from:11,to:13,gen:genAbleitung,explain:`<p><b>Ableiten</b>: (xⁿ)′ = n·xⁿ⁻¹. Die Ableitung ist die Steigung der Tangente. <b>Integrieren</b> ist die Umkehrung: ∫ xⁿ dx = xⁿ⁺¹/(n+1). Bei einem bestimmten Integral setzt du die Grenzen in die Stammfunktion ein.</p><div class="ex">f(x) = x³ → f′(x) = <b>3x²</b></div>`}
];

/* Bank-Einträge zu Themen machen */
const DEFAULT_HINT="Lies die Frage nochmal genau und schließe zuerst Antworten aus, die sicher falsch sind.";
const normT=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’`´]/g,"'").replace(/\s+/g," ").trim();
function parseItem(s){
  const f=s.split("|");
  if(f[0].startsWith("T:")){
    const alts=f[1].split("/");
    const hint=(f[2]||"").replace(/^\?/,"")||"Schreibe das Wort so, wie du es gelernt hast.";
    return{q:f[0].slice(2),type:"text",answers:alts.map(normT),answer:alts[0],show:alts[0],hint,way:`Richtig ist: ${alts[0]}.`};
  }
  let hint=DEFAULT_HINT;
  if(f.length>3&&f[f.length-1].startsWith("?")){hint=f.pop().slice(1);}
  const [q,right,...wrong]=f;
  return{q,type:"choice",choices:shuffle([right,...wrong]),answer:right,hint,way:`Richtig ist: ${right}.`};
}
BANK.forEach(b=>{
  b.deck=[];
  b.gen=function(){
    if(!b.deck.length)b.deck=shuffle(b.items);
    return parseItem(b.deck.pop());
  };
  b.reset=()=>{b.deck=[];};
});

  app.querySelectorAll(".cls").forEach(b=>b.onclick=()=>{K=+b.dataset.k;store.k=K;save();home();});

function home(){
  if(K===null)return classPage();
  markTab("lernen");BACKFN=null;
  S=null;
  const all=topicsFor(K);
  const total=all.reduce((s,t)=>s+starsOf(t.id,K),0),max=all.length*3;
  let html=`<header class="top"><h1>🎓 Lernwelt</h1><span class="pill">⭐ ${total}/${max}</span></header>
  <div class="hero"><div class="row" style="justify-content:space-between"><h2>${CLASS_LABEL(K)}</h2><button class="btn ghost small" id="chg">Klasse wechseln</button></div><div>Wähle ein Fach. Übe 10 Fragen pro Thema und sammle bis zu 3 Sterne.</div><div class="bar"><i style="width:${max?Math.round(total/max*100):0}%"></i></div></div><div class="grid">`;
  SUBJECTS.forEach(s=>{
    const ts=topicsFor(K,s.id);if(!ts.length)return;
    const st=ts.reduce((a,t)=>a+starsOf(t.id,K),0);
    html+=`<button class="topic" data-s="${s.id}"><span class="ic">${s.ic}</span><b>${s.name}</b><span style="color:var(--mute);font-size:.9rem">${ts.length} Thema${ts.length>1?"en":""} · ⭐ ${st}/${ts.length*3}</span></button>`;
  });
  html+=`</div><p class="footer">Dein Fortschritt bleibt in diesem Browser gespeichert.</p>`;
  app.innerHTML=html;
  document.getElementById("chg").onclick=classPage;
  app.querySelectorAll(".topic").forEach(b=>b.onclick=()=>subjectPage(b.dataset.s));
  window.scrollTo(0,0);
}
function subjectPage(sid){
  S=sid;markTab("lernen");BACKFN=()=>home();
  const sub=SUBJECTS.find(x=>x.id===sid);
  const list=topicsFor(K,sid);
  let html=`<button class="back" id="bk">← Alle Fächer</button><header class="top"><h1>${sub.ic} ${sub.name}</h1><span class="pill">${CLASS_LABEL(K)}</span></header>`;
  const card=t=>`<button class="topic" data-id="${t.id}"><span class="ic">${t.ic}</span><b>${t.name}</b>${starStr(starsOf(t.id,K))}</button>`;
  if(sid==="mathe"){
    GROUPS.forEach((g,gi)=>{
      const ts=list.filter(t=>t.group===gi);if(!ts.length)return;
      html+=`<h3 class="group">${g}</h3><div class="grid">${ts.map(card).join("")}</div>`;
    });

  document.getElementById("bk").onclick=home;
  app.querySelectorAll(".topic").forEach(b=>b.onclick=()=>topicPage(b.dataset.id));

}
function roundsOf(t){if(t.rounds)return t.rounds;const n=+(store.rounds)||ROUNDS;return t.bank?Math.min(n,t.items.length):n;}
function topicPage(id){
  const t=ALL.find(x=>x.id===id);
  S=t.subj;markTab("lernen");BACKFN=()=>subjectPage(t.subj);stopSpeak();
  app.innerHTML=`<button class="back" id="bk">← Zurück zur Themenliste</button>
  <div class="card explain"><h2>${t.ic} ${t.name}</h2><div style="color:var(--mute);margin-bottom:6px">${CLASS_LABEL(K)}</div>${t.explain}</div>
  <div class="row"><button class="btn" id="go">Üben starten (${roundsOf(t)} Aufgaben)</button><span>${starStr(starsOf(id,K))}</span></div>
  <h3 class="group">Mehr verstehen (online)</h3><div class="card">${helpBar(t.name+(t.subj==="mathe"?" Mathe":""),K)}<div class="row" style="margin-top:10px"><button class="btn small ghost" id="fv">${isFav("topic:"+t.id)?"★ Gemerkt":"☆ Merken"}</button><button class="btn small ghost" id="vl">🔊 Erklärung vorlesen</button></div></div>`;
  bindHelpBars(app);
  document.getElementById("fv").onclick=e=>{const on=toggleFav({key:"topic:"+t.id,type:"topic",id:t.id,title:t.name,subj:t.subj,k:K});e.target.textContent=on?"★ Gemerkt":"☆ Merken";};
  document.getElementById("vl").onclick=()=>speak(stripHtml(t.explain));
  document.getElementById("bk").onclick=()=>subjectPage(t.subj);
  document.getElementById("go").onclick=()=>quiz(t);
  window.scrollTo(0,0);
}
function sameFrac(a,b,reduced){
  if(a.d===0||b.d===0)return false;
  if(a.n*b.d!==b.n*a.d)return false;
  if(reduced&&gcd(a.n,a.d)!==1)return false;
  return true;
}
function quiz(t){
  const R=t.endless?1e9:roundsOf(t);
  markTab("lernen");const goBack=()=>t.back?t.back():topicPage(t.id);BACKFN=goBack;
  if(t.reset)t.reset();
  let n=0,score=0,cur,attempts,done;
  function next(){
    if(n>=R)return result();
    cur=t.gen(K);attempts=0;done=false;n++;draw();
  }
  function draw(){
    const q=isHtml(cur.q)?cur.q:esc(cur.q);
    let input;
    if(cur.type!=="choice"){
      input=`<div class="row"><input class="ans" id="in" ${cur.type==="text"?'style="width:min(100%,320px)"':""} inputmode="${cur.type==="num"?"decimal":"text"}" autocomplete="off" autocapitalize="off" aria-label="Deine Antwort">${cur.unit?`<span class="unit">${cur.unit}</span>`:""}<button class="btn" id="chk">Prüfen</button></div>`;
    }else{
      input=`<div class="choices">${cur.choices.map(c=>`<button class="choice" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
    }
    app.innerHTML=`<button class="back" id="bk">← Abbrechen</button>
    <div class="progress"><i style="width:${(n-1)/R*100}%"></i></div>
    <div class="card"><div style="color:var(--mute);font-weight:700">${t.name} · Aufgabe ${n}${t.endless?" · "+String(score).replace(".",",")+" Punkte":" von "+R}</div><div class="q">${q}</div>${input}<div id="fb"></div>
    <div class="spacer"></div><div class="row"><button class="btn ghost small" id="tip">💡 Tipp</button></div></div>`;
    document.getElementById("bk").onclick=()=>t.endless?endEnd():goBack();
    document.getElementById("tip").onclick=()=>{const el=document.getElementById("fb");const old=el.querySelector(".next");
      el.innerHTML=`<div class="fb tip"><b>Tipp</b>${cur.hint}</div>`+(old?old.outerHTML:"");bindNext();};
    if(cur.type!=="choice"){
      const inp=document.getElementById("in");inp.focus();
      document.getElementById("chk").onclick=check;
      inp.onkeydown=e=>{if(e.key==="Enter")check();};
    }else{
      app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>checkChoice(b));
    }
    if(typeof onQuestion==="function")onQuestion(cur);
  }
  function bindNext(){const b=document.querySelector(".next");if(b)b.onclick=next;}
  function finish(ok,firstTry){
    done=true;
    if(typeof recordStat==="function")recordStat(t,cur,ok,firstTry);
    if(ok)score+=firstTry?1:.5;
    document.getElementById("fb").insertAdjacentHTML("beforeend",`<div class="spacer"></div><button class="btn next">${n>=R?"Ergebnis ansehen":"Weiter →"}</button>`);bindNext();
    const inp=document.getElementById("in"),chk=document.getElementById("chk");
    if(inp)inp.disabled=true;if(chk)chk.disabled=true;
    app.querySelectorAll(".choice").forEach(b=>b.disabled=true);
  }
  function showAns(){
    if(cur.show)return cur.show;
    if(cur.type==="num")return fmt(cur.answer);
    return String(cur.answer);
  }
  function handle(ok,showRight){
    attempts++;
    if(ok){
      document.getElementById("fb").innerHTML=`<div class="fb ok"><b>Richtig! 🎉</b>${attempts===1?"Super, gleich beim ersten Mal.":"Klasse, beim zweiten Versuch geschafft."}</div>`;
      finish(true,attempts===1);
    }else if(attempts===1&&store.second!==false){
      document.getElementById("fb").innerHTML=`<div class="fb tip"><b>Fast – versuch es nochmal!</b>${cur.hint}</div>`;
    }else{
      document.getElementById("fb").innerHTML=`<div class="fb bad"><b>Das war leider nicht richtig.</b>Richtig ist: <b style="display:inline">${esc(showAns())}${cur.unit?" "+cur.unit:""}</b><br>${store.noway?"":cur.way}</div>`;
      if(showRight)showRight();
      finish(false,false);
    }
  }
  function check(){
    if(done)return;
    const inp=document.getElementById("in");
    const rawFull=inp.value.trim();
    if(!rawFull){inp.focus();return;}
    let ok=false;
    if(cur.type==="text"){
      ok=cur.strict?rawFull===cur.answer:cur.answers.includes(normT(rawFull));
    }else{
      const raw=rawFull.replace(/[−–]/g,"-");
      if(cur.type==="num"){
        const v=parseFloat(raw.replace(",","."));
        if(isNaN(v)){inp.focus();return;}
        ok=Math.abs(v-Number(cur.answer))<1e-6;
      }else{
        const m=raw.match(/^(-?\d+)\s*[\/:]\s*(\d+)$/);
        let f;
        if(m)f={n:+m[1],d:+m[2]};
        else if(/^-?\d+$/.test(raw))f={n:+raw,d:1};
        else{inp.focus();return;}
        ok=sameFrac(f,cur.answer,cur.reduced);
      }
    }
    handle(ok);
    if(!done)inp.select();
  }
  function checkChoice(btn){
    if(done)return;
    const ok=btn.dataset.v===String(cur.answer);
    if(ok)btn.classList.add("right");else{btn.classList.add("wrong");btn.disabled=true;}
    handle(ok,()=>{app.querySelectorAll(".choice").forEach(b=>{if(b.dataset.v===String(cur.answer))b.classList.add("right");});});
  }
  function endEnd(){
    stopSpeak();const asked=n-(done?0:1);
    app.innerHTML=`<div class="card result"><h2>${t.ic} ${t.name}</h2><div class="big">${asked>=5&&score>=asked*.8?"🏆":"💪"}</div><div class="score">${String(score).replace(".",",")} Punkte bei ${asked} Aufgaben</div><p>Es gibt immer neue Aufgaben. Du kannst jederzeit weiterüben.</p><div class="row" style="justify-content:center"><button class="btn" id="again">Weiter üben</button><button class="btn ghost" id="hm">Zurück</button></div></div>`;
    document.getElementById("again").onclick=()=>quiz(t);document.getElementById("hm").onclick=goBack;window.scrollTo(0,0);
  }
  function result(){
    const pts=score/R*10;
    const stars=pts>=9?3:pts>=7?2:pts>=5?1:0;
    const key=skey(t.id,K);const s=store[key]||{stars:0,best:0};
    s.stars=Math.max(s.stars,stars);s.best=Math.max(s.best,score);store[key]=s;save();
    const msg=stars===3?"Fantastisch! Du bist ein Profi! 🏆":stars===2?"Sehr gut! Fast alles richtig.":stars===1?"Gut gemacht! Mit etwas Übung wird es noch besser.":"Nicht schlimm! Lies die Erklärung nochmal und probier es gleich nochmal.";
    app.innerHTML=`<div class="card result"><h2>${t.ic} ${t.name}</h2><div class="big">${"⭐".repeat(stars)||"💪"}</div>
    <div class="score">${String(score).replace(".",",")} von ${R} Punkten</div><p>${msg}</p>
    <div class="row" style="justify-content:center"><button class="btn" id="again">Nochmal üben</button><button class="btn ghost" id="exp">Erklärung</button><button class="btn ghost" id="hm">Themenliste</button></div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn small ghost" id="rv">▶ Erklärvideos zum Thema</button></div></div>`;
    document.getElementById("rv").onclick=()=>openUrl(LINKS.youtube(videoQuery(t.name,K)));
    document.getElementById("again").onclick=()=>quiz(t);
    document.getElementById("exp").onclick=()=>topicPage(t.id);
    BACKFN=()=>subjectPage(t.subj);
    document.getElementById("hm").onclick=()=>subjectPage(t.subj);
    window.scrollTo(0,0);
  }
  next();
}

const hasAndroid=typeof Android!=="undefined";
function openUrl(u){
  try{ if(hasAndroid&&Android.openUrl){Android.openUrl(u);return;} }catch(e){}
  window.open(u,"_blank","noopener");
}
let speaking=false;
function speak(text){
  try{
    if(hasAndroid&&Android.speak){ if(speaking){Android.stopSpeak();speaking=false;return;} Android.speak(text);speaking=true;return; }
    if("speechSynthesis" in window){
      if(speaking){speechSynthesis.cancel();speaking=false;return;}
      const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";u.onend=()=>{speaking=false;};speechSynthesis.speak(u);speaking=true;
    }
  }catch(e){}
}

};
async function wikiSearch(src,q){
  const w=WIKIS[src];
  const r=await fetch(`${w.api}?action=query&list=search&srsearch=${enc(q)}&srlimit=10&format=json&origin=*`);
  const j=await r.json();
  return (j.query&&j.query.search||[]).map(x=>({title:x.title,snippet:x.snippet.replace(/<[^>]+>/g,"").replace(/&quot;/g,'"').replace(/&amp;/g,"&")}));
}
async function wikiPage(src,title){
  const w=WIKIS[src];
  try{
    const r=await fetch(`${w.api}?action=query&prop=extracts&explaintext=1&exsectionformat=plain&redirects=1&titles=${enc(title)}&format=json&origin=*`);
    const j=await r.json();const pages=j.query&&j.query.pages||{};const p=pages[Object.keys(pages)[0]];
    if(p&&p.extract&&p.extract.trim().length>40)return p.extract.trim();
  }catch(e){}
  const r2=await fetch(`${w.api}?action=parse&page=${enc(title)}&prop=text&redirects=1&format=json&origin=*`);
  const j2=await r2.json();
  if(!j2.parse)return"";
  const d=new DOMParser().parseFromString(j2.parse.text["*"],"text/html");
  d.querySelectorAll("style,script,table,.mw-editsection,.reference,sup").forEach(x=>x.remove());
  return [...d.querySelectorAll("p,h2,h3,li")].map(x=>(x.tagName==="H2"||x.tagName==="H3"?"\n":"")+x.textContent.trim()).filter(Boolean).join("\n\n");
}

/* ---------- Suche (Lernstoff offline + online) ---------- */
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const stemOf=w=>{const x=w.replace(/(rechnung|rechnen|lehre|ungen|ung|en|er|e|n|s)$/,"");return x.length>=4?x:w;};
const hit=(hay,w)=>hay.includes(w)||hay.includes(stemOf(w));
function offlineSearch(q){
  const words=norm(q).split(/\s+/).filter(w=>w.length>1);
  if(!words.length)return[];
  const out=[];
  ALL.forEach(t=>{
    let hay=norm(t.name+" "+stripHtml(t.explain)+" "+subjName(t.subj));
    if(t.items)hay+=" "+norm(t.items.join(" ").replace(/\|/g," "));
    if(typeof KBTEXT==="function")hay+=" "+norm(KBTEXT(t.id));
    let sc=0;words.forEach(w=>{if(hit(norm(t.name),w))sc+=5;if(hit(hay,w))sc+=1;});
    if(sc&&words.every(w=>hit(hay,w)))out.push({kind:"topic",t,sc:sc+3});else if(sc>=5)out.push({kind:"topic",t,sc});
  });
  CATALOG.forEach(c=>{
    const hay=norm(c.title+" "+c.subs.join(" ")+" "+subjName(c.subj));
    let sc=0;words.forEach(w=>{if(hit(hay,w))sc+=2;});
    if(sc&&words.every(w=>hit(hay,w)))out.push({kind:"cat",c,sc:sc+2});
  });
  return out.sort((a,b)=>b.sc-a.sc).slice(0,12);
}

function favPage(){
  markTab("merk");S=null;
  const noteHtml=n=>`<div class="card note" data-id="${n.id}"><div class="row" style="justify-content:space-between"><b>${esc(n.title||"Notiz")}</b><button class="btn small ghost" data-del="${n.id}">Löschen</button></div>${n.img?`<img src="${n.img}" style="max-width:100%;border-radius:12px;margin:8px 0">`:""}<div style="white-space:pre-wrap">${esc(n.text||"")}</div></div>`;
  app.innerHTML=`<header class="top"><h1>⭐ Merkliste und Notizen</h1></header>
  <h3 class="group">Gemerkt</h3><div id="fl">${store.fav.length?store.fav.map((f,i)=>`<button class="resitem" data-i="${i}"><b>${f.type==="wiki"?"📖":f.type==="topic"?"🎯":"📋"} ${esc(f.title)}</b><span>${f.type==="wiki"?esc(WIKIS[f.src].name):esc(subjName(f.subj))}${f.type==="topic"?" · "+esc(CLASS_LABEL(f.k)):""}</span></button>`).join(""):`<div class="card" style="color:var(--mute)">Noch nichts gemerkt. Tippe bei Erklärungen und Themen auf „Merken“.</div>`}</div>
  <h3 class="group">Notizen</h3>
  <div class="card"><input class="ans" id="nt" style="width:100%;font-size:1rem" placeholder="Titel (z. B. Mathe Hausaufgabe)"><textarea id="nx" class="ta" placeholder="Notiz, Aufgabe oder Frage …"></textarea>
  <div class="row"><label class="btn small ghost" style="cursor:pointer">📷 Foto anhängen<input type="file" id="nf" accept="image/*" style="display:none"></label><button class="btn small" id="ns">Speichern</button></div><div id="np" style="margin-top:8px"></div></div>
  <div id="nl">${store.notes.map(noteHtml).join("")}</div>`;
  app.querySelectorAll("#fl .resitem").forEach(b=>b.onclick=()=>{
    const f=store.fav[+b.dataset.i];
    if(f.type==="wiki")readerPage(f.src,f.title,f.q||f.title);
    else if(f.type==="topic"){K=f.k;store.k=K;save();S=f.subj;markTab("lernen");topicPage(f.id);}
    else{const c=CATALOG.find(x=>x.title===f.title&&x.subj===f.subj);if(c)catDetail(c);}
  });
  let img=null;
  document.getElementById("nf").onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const rd=new FileReader();
    rd.onload=()=>{const im=new Image();im.onload=()=>{
      const sc=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*sc;c.height=im.height*sc;
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);img=c.toDataURL("image/jpeg",.6);
      document.getElementById("np").innerHTML=`<img src="${img}" style="max-width:60%;border-radius:10px">`;};im.src=rd.result;};
    rd.readAsDataURL(file);
  };
  document.getElementById("ns").onclick=()=>{
    const t=document.getElementById("nt").value.trim(),x=document.getElementById("nx").value.trim();
    if(!t&&!x&&!img)return;
    store.notes.unshift({id:Date.now(),title:t,text:x,img});save();favPage();
  };
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{store.notes=store.notes.filter(n=>String(n.id)!==b.dataset.del);save();favPage();});
}

function spellQ(list,mkWrongs,rule,gaps){
  const w=pick(list),wr=mkWrongs(w).filter(x=>x!==w);
  const mode=Math.random();
  if(gaps&&mode<.35){
    const g=gaps(w);
    if(g)return mkT(`Welche Buchstaben fehlen?<br><b style="font-size:1.7rem;letter-spacing:.08em">${esc(g.shown)}</b>`,g.missing,rule,true,{say:w});
  }
  if(mode<.55&&wr.length)return mkC(`Welches Wort ist richtig geschrieben?`,w,wr,rule);
  const q=`Hör zu und wähle die richtige Schreibweise.<br><button class="btn small ghost" onclick="speak('${w}')">🔊 Wort anhören</button>`;
  return wr.length?mkC(q,w,wr,rule):mkT(`Schreibe das Wort richtig.<br><button class="btn small" onclick="speak('${w}')">🔊 Wort anhören</button>`,w,rule,true,{say:w});
}
const gapOf=(re)=>w=>{const m=w.match(re);if(!m)return null;return{shown:w.slice(0,m.index)+"_".repeat(m[0].length)+w.slice(m.index+m[0].length),missing:m[0]};};

function vocPairs(subj,k){
  const out=[];
  VOC[subj].forEach(([lv,s])=>{
    if(lv>Math.max(k,VOC[subj][0][0]))return;
    s.split(/\s+(?=[^=\s]+=)/).forEach(p=>{const i=p.indexOf("=");if(i>0)out.push([p.slice(0,i),p.slice(i+1)]);});
  });
  return out;
}
