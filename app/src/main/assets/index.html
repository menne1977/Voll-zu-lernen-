MG("textaufg","📖","Textaufgaben (endlos)",0,2,9,"Gehe immer so vor: <b>1. Lesen</b> und markieren, was gegeben ist. <b>2. Fragen</b>: Was wird gesucht? <b>3. Rechnung</b> aufschreiben. <b>4. Antwortsatz</b> und prüfen, ob die Zahl zur Geschichte passt.",k=>{
  const nm=pick(["Lena","Tom","Mia","Ben","Emma","Jonas","Sara","Paul"]);
  const low=[
   ()=>{const a=rnd(5,40),b=rnd(3,30);return nq(`${nm} hat ${a} Murmeln und bekommt ${b} dazu. Wie viele hat ${nm} jetzt?`,a+b,"„dazu“ heißt plus.",`Gegeben: ${a} und ${b}. Gesucht: Summe. ${a} + ${b} = ${a+b}.`);},
   ()=>{const a=rnd(20,60),b=rnd(3,19);return nq(`In der Klasse sind ${a} Kinder. ${b} sind krank. Wie viele sind da?`,a-b,"„krank“ heißt weg: minus.",`${a} − ${b} = ${a-b}.`);},
   ()=>{const a=rnd(3,12),b=rnd(2,9);return nq(`Eine Packung enthält ${a} Kekse. ${nm} kauft ${b} Packungen. Wie viele Kekse sind das?`,a*b,"Gleiche Mengen: mal.",`${a} · ${b} = ${a*b}.`);},
   ()=>{const b=rnd(2,9),c=rnd(2,9);return nq(`${b*c} Bonbons werden gerecht an ${b} Kinder verteilt. Wie viele bekommt jedes Kind?`,c,"Gerecht verteilen: geteilt.",`${b*c} : ${b} = ${c}.`);}
  ];
  const high=[
   ()=>{const a=pick([80,120,200,400,600]),p=pick([10,20,25,50]);return nq(`Ein Fahrrad kostet ${a} €. Es gibt ${p} % Rabatt. Wie viel kostet es jetzt?`,a-a*p/100,"Rechne zuerst den Rabatt in Euro aus.",`Rabatt: ${a} · ${p}/100 = ${a*p/100} €. Neuer Preis: ${a} − ${a*p/100} = ${a-a*p/100} €.`,"€");},
   ()=>{const n=rnd(2,5),pr=pick([1.5,2,2.5,3,4]),m=n+rnd(2,5);return nq(`${n} Hefte kosten ${String(r2(n*pr)).replace(".",",")} €. Was kosten ${m} Hefte?`,r2(m*pr),"Dreisatz: erst der Preis für 1 Heft.",`1 Heft: ${String(r2(n*pr)).replace(".",",")} : ${n} = ${String(pr).replace(".",",")} €. ${m} Hefte: ${String(pr).replace(".",",")} · ${m} = ${String(r2(m*pr)).replace(".",",")} €.`,"€");},
   ()=>{const v=pick([40,50,60,80,100]),t=rnd(2,5);return nq(`Ein Auto fährt ${t} Stunden mit ${v} km/h. Wie weit kommt es?`,v*t,"Strecke = Geschwindigkeit · Zeit.",`s = ${v} · ${t} = ${v*t} km.`,"km");},
   ()=>{const a=rnd(3,15),b=rnd(2,12);return nq(`Ein Rechteck ist ${a} cm lang und ${b} cm breit. Wie groß ist der Umfang?`,2*(a+b),"U = 2 · (Länge + Breite).",`2 · (${a} + ${b}) = ${2*(a+b)} cm.`,"cm");},
   ()=>{const x=rnd(3,12),d=rnd(2,6);return nq(`${nm} ist ${d} Jahre älter als ${nm==="Tom"?"Mia":"Tom"}. Zusammen sind sie ${2*x+d} Jahre alt. Wie alt ist der Jüngere?`,x,"Der Jüngere ist x Jahre alt, der Ältere x + "+d+".",`x + (x + ${d}) = ${2*x+d} → 2x = ${2*x} → x = ${x}.`);}
  ];
  return pick(k>=5?high.concat(low.slice(0,1)):low)();
});
MG("trick","⚡","Schnell rechnen mit Tricks",0,3,8,"Mit kleinen Tricks rechnest du im Kopf viel schneller: <b>mal 5</b> = halbieren, dann mal 10. <b>Mal 9</b> = mal 10 minus die Zahl. <b>Mal 11</b> bei zweistelligen Zahlen: Quersumme in die Mitte. <b>Quadrat von Zahlen mit 5 am Ende</b>: n · (n+1), dann 25 dahinter.",()=>{
  const t=rnd(0,4);
  if(t===0){const n=2*rnd(6,48);return nq(`${n} · 5 = ?  (Trick: halbieren, dann mal 10)`,n*5,"Halbiere die Zahl und hänge eine 0 an.",`${n} : 2 = ${n/2}, mal 10 = ${n*5}.`);}
  if(t===1){const n=rnd(12,60);return nq(`${n} · 9 = ?  (Trick: mal 10 minus die Zahl)`,n*9,"Rechne n · 10 und ziehe n ab.",`${n}·10 = ${n*10}, minus ${n} = ${n*9}.`);}
  if(t===2){let a,b;do{a=rnd(1,9);b=rnd(0,9);}while(a+b>9);const n=a*10+b;return nq(`${n} · 11 = ?  (Trick: ${a} … ${a+b} … ${b})`,n*11,"Schreibe die Quersumme zwischen die beiden Ziffern.",`${a} | ${a}+${b}=${a+b} | ${b} → ${n*11}.`);}
  if(t===3){const a=rnd(1,9);const n=a*10+5;return nq(`${n}² = ?  (Trick: ${a} · ${a+1}, dann 25 dahinter)`,n*n,"Multipliziere die Zehnerziffer mit ihrem Nachfolger und hänge 25 an.",`${a} · ${a+1} = ${a*(a+1)}, dahinter 25 → ${n*n}.`);}
  const n=4*rnd(3,30);return nq(`${n} · 25 = ?  (Trick: durch 4, dann mal 100)`,n*25,"25 ist ein Viertel von 100.",`${n} : 4 = ${n/4}, mal 100 = ${n*25}.`);
});
MG("terme","🔡","Terme vereinfachen",4,6,10,"Gleichartige Glieder darfst du <b>zusammenfassen</b>: 3x + 2x = 5x. Beim <b>Ausmultiplizieren</b> wird jedes Glied in der Klammer mit dem Faktor malgenommen: 2 · (x + 3) = 2x + 6.",()=>{
  const a=rnd(2,9),b=rnd(1,8),c=rnd(2,6),d=rnd(1,9);const t=rnd(0,3);
  if(t===0)return mkC(`${a}x + ${b}x = ?`,`${a+b}x`,[`${a*b}x`,`${a+b}x²`,`${a+b}`],"Gleiche Unbekannte: Zahlen davor addieren.",`${a}x + ${b}x = ${a+b}x.`);
  if(t===1)return mkC(`${c}(x + ${d}) = ?`,`${c}x + ${c*d}`,[`${c}x + ${d}`,`x + ${c*d}`,`${c+1}x + ${c*d}`],"Jedes Glied in der Klammer mit "+c+" malnehmen.",`${c}·x = ${c}x und ${c}·${d} = ${c*d}.`);
  if(t===2)return mkC(`${a+b}x + ${d} − ${b}x − ${d-1>0?d-1:0} = ?`,`${a}x + ${d-(d-1>0?d-1:0)}`,[`${a}x`,`${a+2*b}x + ${d}`,`${a}x + ${d}`].filter(x=>x!==`${a}x + ${d-(d-1>0?d-1:0)}`),"x-Glieder und Zahlen getrennt zusammenfassen.",`(${a+b}x − ${b}x) + (${d} − ${d-1>0?d-1:0}) = ${a}x + ${d-(d-1>0?d-1:0)}.`);
  return nq(`Setze x = ${b} ein: ${a}x + ${d} = ?`,a*b+d,"Ersetze x durch die Zahl und rechne.",`${a} · ${b} + ${d} = ${a*b+d}.`);
});

/* ======================================================================
   Mathe-Wissen: zu jedem Thema eine einfache und eine ausführliche
   Erklärung, Beispiel Schritt für Schritt, Tricks, typische Fehler, Merksatz.
   Alles selbst geschrieben.
   ====================================================================== */
const KB={};
const KBF=["Einfach erklärt","Ausführlich","Beispiel","Tricks","Typische Fehler","Merksatz"];
const K_=(id,e,a,b,t,f,m)=>{KB[id]={e,a,b,t,f,m};};
K_("zaehlen","Zählen heißt: Jedes Ding bekommt der Reihe nach eine Zahl. Du tippst jedes Ding einmal an und sagst dabei die Zahlen: eins, zwei, drei …","Die <b>letzte</b> Zahl, die du sagst, sagt dir, <b>wie viele</b> es sind. Wichtig: Jedes Ding nur <b>einmal</b> zählen. Bei vielen Dingen hilft es, sie zu ordnen (in Reihen oder Fünfergruppen) oder schon gezählte Dinge wegzuschieben.","<div class=\"ex\">🍎🍎🍎🍎<br>Tippe: 1 – 2 – 3 – 4. Es sind <b>4</b> Äpfel.</div>","Zähle in Zweierschritten (2, 4, 6 …) oder Fünferschritten, das geht schneller. Mit den Fingern darfst du immer zählen!","Ein Ding doppelt zählen oder eins vergessen. Hilfe: mit dem Finger jedes Bild antippen.","Eine Zahl für jedes Ding, und die letzte Zahl ist das Ergebnis.");
K_("vergleich","Von zwei Zahlen ist die größer, die weiter rechts auf dem Zahlenstrahl steht. Du kannst mit &lt; (kleiner), &gt; (größer) und = (gleich) vergleichen.","Zahlen vergleichst du <b>Stelle für Stelle von links</b>: Zuerst die größte Stelle (Tausender, dann Hunderter, dann Zehner …). Die erste Stelle, die sich unterscheidet, entscheidet. Das Zeichen &lt; öffnet sich zur größeren Zahl hin (wie ein Krokodilmaul, das die größere Zahl fressen will).","<div class=\"ex\">Vergleiche 4 758 und 4 785:<br>Tausender 4 = 4, Hunderter 7 = 7, Zehner 5 &lt; 8<br>also 4 758 &lt; 4 785</div>","Erst die Anzahl der Stellen vergleichen: Mehr Stellen heißt größere Zahl (bei Zahlen ohne führende Null).","Bei Dezimalzahlen: 0,45 ist NICHT größer als 0,5 (0,45 = 45 Hundertstel, 0,5 = 50 Hundertstel).","Von links nach rechts vergleichen, die erste andere Stelle entscheidet.");
K_("plus","Plus heißt: Es kommt etwas dazu. 3 + 2 bedeutet: Du hast 3 und bekommst 2 dazu, zusammen sind es 5.","Beim Addieren sind die Zahlen <b>Summanden</b>, das Ergebnis ist die <b>Summe</b>. Du darfst die Summanden <b>vertauschen</b> (3 + 2 = 2 + 3). Über die Zehnerzahl rechnest du in zwei Schritten: erst bis zur 10 auffüllen, dann den Rest dazu (8 + 5 = 8 + 2 + 3 = 13). Größere Zahlen zerlegst du in Hunderter, Zehner und Einer.","<div class=\"ex\">47 + 36<br>47 + 30 = 77<br>77 + 6 = 83</div>","Beginne mit der größeren Zahl. Doppelte Zahlen (6 + 6 = 12) und Nachbarzahlen (6 + 7 = 6 + 6 + 1) kannst du dir leicht merken.","Beim Zerlegen einen Teil vergessen. Immer mit einer Probe prüfen: Umkehraufgabe 83 − 36 = 47.","Plus ist tauschbar: a + b = b + a.");
K_("minus","Minus heißt: Es wird etwas weggenommen. 7 − 3 bedeutet: Von 7 nimmst du 3 weg, es bleiben 4.","Beim Subtrahieren ist die erste Zahl der <b>Minuend</b>, die zweite der <b>Subtrahend</b>, das Ergebnis die <b>Differenz</b>. Minus ist <b>nicht tauschbar</b> (7 − 3 ≠ 3 − 7). Über den Zehner: erst bis zur Zehnerzahl zurückrechnen, dann den Rest (13 − 5 = 13 − 3 − 2 = 8). Die <b>Probe</b>: Rechne das Ergebnis plus die kleine Zahl.","<div class=\"ex\">83 − 36<br>83 − 30 = 53<br>53 − 6 = 47<br>Probe: 47 + 36 = 83 ✓</div>","Abziehen kannst du auch als Ergänzen rechnen: Wie viel fehlt von 36 bis 83? 36 + 4 = 40, + 43 = 83, also 47.","Zahlen vertauschen (kleine minus große). Beim Abziehen über den Zehner die Zehner vergessen.","Minus ist die Umkehrung von Plus: Probe mit Plus!");
K_("mal","Mal heißt: Dieselbe Zahl mehrmals zusammenzählen. 3 · 4 bedeutet 4 + 4 + 4 = 12. Das Einmaleins musst du auswendig können.","Beim Multiplizieren heißen die Zahlen <b>Faktoren</b>, das Ergebnis ist das <b>Produkt</b>. Mal ist <b>tauschbar</b> (3 · 4 = 4 · 3). Aufgaben kannst du <b>zerlegen</b>: 7 · 8 = 7 · 5 + 7 · 3 = 35 + 21 = 56. Und mit <b>Nachbaraufgaben</b>: 6 · 7 = 6 · 6 + 6.","<div class=\"ex\">Reihe der 7:<br>7, 14, 21, 28, 35, 42, 49, 56, 63, 70<br>7 · 8 = 56</div>","Mal 10: Null anhängen. Mal 5: halbe Zehnerzahl. Mal 9: mal 10 minus die Zahl. Quadratzahlen (1, 4, 9, 16, 25, 36 …) extra lernen.","Mal 0 ergibt 0 (nicht die Zahl). Reihen verwechseln, etwa 7 · 8 und 6 · 8. Üben hilft!","Mal ist wiederholtes Plus und ist tauschbar.");
K_("geteilt","Geteilt heißt: Du verteilst gerecht. 12 : 3 bedeutet: 12 Dinge auf 3 Kinder verteilen, jedes bekommt 4.","Teilen ist die <b>Umkehrung</b> von Malnehmen: Weil 3 · 4 = 12, ist 12 : 3 = 4 und 12 : 4 = 3. Bei <b>Rest</b>: 14 : 4 = 3 Rest 2, weil 4 · 3 = 12 und 2 übrig bleiben. Durch <b>0</b> darf man nie teilen. Teilen ist nicht tauschbar.","<div class=\"ex\">56 : 7 = ?<br>Frage: 7 mal welche Zahl ergibt 56?<br>7 · 8 = 56, also <b>8</b></div>","Nutze das Einmaleins rückwärts. Bei großen Zahlen: erst halbieren, dann nochmal halbieren (durch 4).","Rest größer oder gleich dem Teiler lassen. Der Rest muss immer kleiner sein als die Zahl, durch die du teilst.","Geteilt ist die Umkehrung von Mal. Durch 0 teilen geht nicht.");
K_("schriftlich","Beim schriftlichen Rechnen schreibst du die Zahlen genau untereinander und rechnest Stelle für Stelle.","<b>Schriftliches Malnehmen</b>: Rechne jede Ziffer des zweiten Faktors mal den ganzen ersten Faktor, schreibe die Teilergebnisse versetzt untereinander und addiere sie. <b>Schriftliches Teilen</b>: Du gehst von links nach rechts: teilen, malnehmen, abziehen, nächste Ziffer herunterholen.","<div class=\"ex\">36 · 24<br>36 · 20 = 720<br>36 · 4 = 144<br>720 + 144 = <b>864</b></div>","Schätze zuerst: 36 · 24 ist etwa 40 · 25 = 1000. Dann merkst du grobe Fehler.","Stellen verrutschen (Zehnerreihe um eine Stelle versetzen). Beim Teilen die Null vergessen, wenn die Ziffer nicht passt.","Erst schätzen, dann genau rechnen, dann Probe.");
K_("runden","Runden heißt: Du machst eine Zahl einfacher, die nur ungefähr stimmt. 47 gerundet auf Zehner ist 50.","Schau auf die Ziffer <b>direkt rechts</b> von der Stelle, auf die du rundest: <b>0 bis 4 abrunden</b>, <b>5 bis 9 aufrunden</b>. Alle Stellen danach werden Null. Gerundete Zahlen benutzt man zum <b>Überschlagen</b> und <b>Schätzen</b>.","<div class=\"ex\">3 748 auf Hunderter runden:<br>Hunderter-Ziffer 7, Nachbarziffer 4 → abrunden<br><b>3 700</b></div>","Auf dem Zahlenstrahl: Zu welcher Zehnerzahl ist die Zahl näher?","Bei 5 am Ende wird aufgerundet (45 → 50). Nicht die falsche Stelle anschauen.","Ziffer rechts davon: 0–4 ab, 5–9 auf.");
K_("brueche","Ein Bruch ist ein Teil von einem Ganzen. 3/4 bedeutet: Ein Ganzes ist in 4 gleiche Teile geteilt, du nimmst 3 davon.","Oben steht der <b>Zähler</b> (wie viele Teile), unten der <b>Nenner</b> (in wie viele Teile geteilt). <b>Addieren/Subtrahieren</b>: erst auf den <b>gleichen Nenner</b> bringen, dann nur die Zähler rechnen. <b>Multiplizieren</b>: Zähler mal Zähler, Nenner mal Nenner. <b>Dividieren</b>: mit dem <b>Kehrwert</b> malnehmen. Gemischte Zahlen (1 1/2) kannst du in unechte Brüche (3/2) umwandeln.","<div class=\"ex\">1/2 + 1/3<br>Hauptnenner 6: 3/6 + 2/6 = <b>5/6</b><br><br>2/3 · 3/4 = 6/12 = <b>1/2</b><br><br>1/2 : 1/4 = 1/2 · 4/1 = <b>2</b></div>","Vor dem Malnehmen kürzen (über Kreuz). Hauptnenner: kleinstes gemeinsames Vielfaches der Nenner.","Nenner addieren (1/2 + 1/3 ≠ 2/5). Beim Erweitern nur den Zähler ändern. Ergebnis nicht gekürzt.","Gleichnamig machen, dann nur die Zähler addieren. Mal: oben mal oben, unten mal unten. Geteilt: Kehrwert.");
K_("kuerzen","Beim Kürzen und Erweitern ändert sich nur das Aussehen des Bruchs, nicht sein Wert.","<b>Kürzen</b>: Zähler und Nenner durch dieselbe Zahl teilen. Am besten durch den <b>größten gemeinsamen Teiler (ggT)</b>, dann ist der Bruch ganz gekürzt. <b>Erweitern</b>: Zähler und Nenner mit derselben Zahl malnehmen, zum Beispiel um Brüche gleichnamig zu machen.","<div class=\"ex\">18/24 : 6 = <b>3/4</b><br>2/5 · 3 = <b>6/15</b></div>","Teilbarkeitsregeln helfen: gerade → durch 2, Quersumme durch 3 teilbar → durch 3, Endziffer 0 oder 5 → durch 5.","Nur oben oder nur unten teilen oder malnehmen. Immer BEIDES.","Zähler und Nenner immer mit derselben Zahl malnehmen oder teilen.");
K_("dezimal","Dezimalzahlen (Kommazahlen) sind eine andere Schreibweise für Brüche. 0,5 ist dasselbe wie 1/2.","Die Stellen hinter dem Komma sind <b>Zehntel, Hundertstel, Tausendstel …</b>. Beim <b>Addieren und Subtrahieren</b> schreibst du Komma unter Komma. Beim <b>Malnehmen</b> rechnest du ohne Komma und setzt es so, dass das Ergebnis so viele Nachkommastellen hat wie beide Faktoren zusammen. Beim <b>Teilen</b> verschiebst du bei beiden Zahlen das Komma gleich weit nach rechts.","<div class=\"ex\">2,5 · 0,4<br>25 · 4 = 100<br>zusammen 2 Nachkommastellen → <b>1,00 = 1</b><br><br>3,6 : 0,4 = 36 : 4 = <b>9</b></div>","Mal 10, 100, 1000: Komma nach rechts. Durch 10, 100, 1000: Komma nach links.","Das Komma nicht untereinander schreiben. 0,3 · 0,3 ist 0,09 (nicht 0,9).","Komma unter Komma beim Plus und Minus.");
K_("prozent","Prozent heißt „von Hundert“. 25 % bedeutet 25 von 100, das ist ein Viertel.","Drei Größen gehören zusammen: <b>Grundwert G</b> (das Ganze), <b>Prozentsatz p</b> und <b>Prozentwert W</b>. <b>W = G · p/100</b>, <b>p = W / G · 100</b>, <b>G = W / p · 100</b>. Prozentuale Zunahme: Faktor 1 + p/100 (bei +20 % mal 1,2), Abnahme: 1 − p/100 (bei −20 % mal 0,8).","<div class=\"ex\">20 % von 150 €:<br>150 : 100 = 1,50 (1 %)<br>1,50 · 20 = <b>30 €</b></div>","10 % = durch 10 teilen, 50 % = halbieren, 25 % = zweimal halbieren. 1 % ausrechnen und mit p malnehmen.","Grundwert und Prozentwert verwechseln. Erst +10 %, dann −10 % ergibt NICHT wieder das Original.","W = G · p/100: Prozentwert ist Grundwert mal Prozentsatz.");
K_("negativ","Negative Zahlen sind Zahlen kleiner als 0, zum Beispiel Temperaturen unter 0 Grad oder Schulden. Auf dem Zahlenstrahl liegen sie links von der Null.","Je weiter links, desto kleiner: −5 &lt; −2. Der <b>Betrag</b> |−5| = 5 ist der Abstand zur Null. <b>Addieren</b> einer negativen Zahl heißt abziehen. <b>Minus mal Minus ergibt Plus</b>, Minus mal Plus ergibt Minus. Beim Teilen gelten dieselben Vorzeichenregeln.","<div class=\"ex\">−3 + 8 = <b>5</b><br>4 − 9 = <b>−5</b><br>(−3) · (−4) = <b>12</b><br>(−12) : 4 = <b>−3</b></div>","Gleiche Vorzeichen: Ergebnis positiv. Verschiedene Vorzeichen: Ergebnis negativ. Beim Plus/Minus: Zahlenstrahl in Gedanken laufen.","−5 ist kleiner als −2, nicht größer. Aus „− (−3)“ wird „+ 3“.","Gleiche Vorzeichen: plus. Verschiedene Vorzeichen: minus.");
K_("teilbar","Eine Zahl ist durch eine andere teilbar, wenn beim Teilen kein Rest bleibt. Primzahlen sind nur durch 1 und sich selbst teilbar.","<b>Teilbarkeitsregeln</b>: durch 2 (Endziffer gerade), durch 3 (Quersumme durch 3), durch 4 (letzte zwei Ziffern durch 4), durch 5 (Endziffer 0 oder 5), durch 9 (Quersumme durch 9), durch 10 (Endziffer 0). <b>Primzahlen</b>: 2, 3, 5, 7, 11, 13, 17, 19, 23 … <b>Primfaktorzerlegung</b>: eine Zahl als Produkt von Primzahlen schreiben (60 = 2 · 2 · 3 · 5). <b>ggT</b> und <b>kgV</b> findest du damit.","<div class=\"ex\">Ist 372 durch 3 teilbar?<br>Quersumme 3+7+2 = 12, durch 3 teilbar → ja.<br>372 = 3 · 124</div>","Sieb des Eratosthenes: Streiche alle Vielfachen von 2, 3, 5, 7 – die übrigen sind Primzahlen.","1 ist keine Primzahl. 2 ist die einzige gerade Primzahl.","Quersumme durch 3 oder 9 teilbar → Zahl auch durch 3 oder 9 teilbar.");
K_("dreisatz","Beim Dreisatz rechnest du von einer Menge auf eine andere. Erst auf 1 Stück, dann auf viele.","<b>Proportional</b> („je mehr, desto mehr“): Preis, Menge, Strecke. Schritt 1: auf <b>1</b> zurückrechnen (teilen). Schritt 2: auf die gesuchte Menge hochrechnen (malnehmen). <b>Antiproportional</b> („je mehr, desto weniger“): Arbeiter und Zeit. Dort malnimmst du erst und teilst dann.","<div class=\"ex\">4 Äpfel kosten 3,20 €. 7 Äpfel?<br>1 Apfel: 3,20 : 4 = 0,80 €<br>7 Äpfel: 0,80 · 7 = <b>5,60 €</b><br><br>3 Arbeiter brauchen 8 Tage. 6 Arbeiter?<br>3 · 8 = 24 Arbeitertage, 24 : 6 = <b>4 Tage</b></div>","Frage dich: Wird das Ergebnis größer oder kleiner? Passt die Richtung zur Geschichte?","Proportional und antiproportional verwechseln. Einheiten nicht mitschreiben.","Erst auf 1, dann auf die gesuchte Menge.");
K_("potenz","Eine Potenz ist eine Kurzschreibweise für wiederholtes Malnehmen. 2³ = 2 · 2 · 2 = 8. Die Wurzel ist die Umkehrung: √9 = 3.","In a<sup>n</sup> heißt a die <b>Basis</b> und n der <b>Exponent</b>. Quadratzahlen: 1, 4, 9, 16, 25, 36, 49, 64, 81, 100. <b>Wurzel</b> √a ist die positive Zahl, deren Quadrat a ergibt. Weiter gelten die Potenzgesetze (siehe Thema Potenzgesetze).","<div class=\"ex\">5² = 25, 2⁴ = 16, 10³ = 1000<br>√81 = 9, ∛27 = 3</div>","Zweierpotenzen auswendig: 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024.","2³ ist nicht 2 · 3, sondern 2 · 2 · 2. √(a + b) ist nicht √a + √b.","Potenz = wiederholtes Malnehmen, Wurzel = Umkehrung.");
K_("potgesetz","Mit den Potenzgesetzen rechnest du Potenzen schnell zusammen, ohne alles auszurechnen.","Gleiche Basis: <b>a<sup>m</sup> · a<sup>n</sup> = a<sup>m+n</sup></b>, <b>a<sup>m</sup> : a<sup>n</sup> = a<sup>m−n</sup></b>. Potenz von Potenz: <b>(a<sup>m</sup>)<sup>n</sup> = a<sup>m·n</sup></b>. Gleicher Exponent: <b>a<sup>n</sup> · b<sup>n</sup> = (a·b)<sup>n</sup></b>. Und a<sup>0</sup> = 1, a<sup>−n</sup> = 1 / a<sup>n</sup>.","<div class=\"ex\">2³ · 2⁴ = 2⁷ = 128<br>(3²)³ = 3⁶ = 729<br>5⁻² = 1/25</div>","Zuerst die Basis gleich machen (4 = 2², 8 = 2³), dann die Gesetze nutzen.","Bei a<sup>m</sup> + a<sup>n</sup> darf man NICHT die Exponenten addieren.","Malnehmen: Exponenten plus. Teilen: minus. Potenz von Potenz: mal.");
K_("geld","Geld rechnest du mit Euro (€) und Cent (ct). 1 € sind 100 ct. Beim Bezahlen bekommst du Rückgeld.","Beim <b>Rückgeld</b> rechnest du: Gegeben − Preis. Oder du <b>ergänzt</b> vom Preis bis zum Schein. Mehrere Preise addierst du Euro für Euro und Cent für Cent. Im Ergebnis stehen zwei Nachkommastellen.","<div class=\"ex\">Preis 3,60 €, bezahlt mit 5 €.<br>Von 3,60 bis 4,00: 40 ct, bis 5,00: 1 € → <b>1,40 €</b></div>","Immer erst zum vollen Euro, dann zum Schein ergänzen.","Cent und Euro vermischen (0,5 € sind 50 ct, nicht 5 ct).","1 € = 100 ct. Rückgeld = bezahlt − Preis.");
K_("laenge","Längen misst du in mm, cm, dm, m und km. Du kannst sie ineinander umrechnen.","Umrechnungszahlen: 1 cm = 10 mm, 1 dm = 10 cm, 1 m = 10 dm = 100 cm = 1000 mm, 1 km = 1000 m. Von der <b>großen</b> in die <b>kleine</b> Einheit: <b>malnehmen</b>. Von der <b>kleinen</b> in die <b>große</b>: <b>teilen</b>. Das Komma verschiebst du entsprechend.","<div class=\"ex\">3,5 m = 350 cm (mal 100)<br>4 200 m = 4,2 km (durch 1000)</div>","Stufenzahl merken: bei Länge 10, 10, 10, bis 1000 bei km. Bei Fläche 100, bei Volumen 1000.","Falsch herum umrechnen. Prüfe: Kleine Einheit → größere Zahl.","Große Einheit zu kleiner: malnehmen. Kleine zu großer: teilen.");
K_("gewicht","Gewicht (Masse) misst du in g, kg und t. Flüssigkeiten misst du in ml und l.","1 kg = 1000 g, 1 t = 1000 kg, 1 l = 1000 ml. Das Umrechnen geht wie bei Längen: große in kleine Einheit malnehmen, kleine in große teilen. 1 l Wasser wiegt etwa 1 kg. 1 ml entspricht 1 cm³.","<div class=\"ex\">2,5 kg = 2 500 g<br>750 ml = 0,75 l</div>","Halbes Kilo = 500 g, Viertelkilo = 250 g, Viertelliter = 250 ml.","Gramm und Kilogramm vermischen.","1 kg = 1000 g, 1 l = 1000 ml.");
K_("uhr","Auf der Uhr zeigt der kurze Zeiger die Stunden, der lange die Minuten. Ein Tag hat 24 Stunden, eine Stunde 60 Minuten.","Es gibt die <b>12-Stunden-Uhr</b> (vormittags/nachmittags) und die <b>24-Stunden-Uhr</b> (13 Uhr = 1 Uhr nachmittags). <b>Zeitspannen</b> rechnest du in Schritten: erst bis zur vollen Stunde, dann die Stunden, dann die Restminuten. 1 h = 60 min, 1 min = 60 s.","<div class=\"ex\">Von 8:40 bis 11:15:<br>8:40 → 9:00 = 20 min<br>9:00 → 11:00 = 2 h<br>11:00 → 11:15 = 15 min<br>Zusammen <b>2 h 35 min</b></div>","Bei „Viertel nach“ = :15, „halb“ = :30, „Viertel vor“ = :45.","Mit 100 statt 60 rechnen (1,5 Stunden sind 1 h 30 min, nicht 1 h 50 min).","1 Stunde = 60 Minuten, nicht 100!");
K_("geo","Formen haben Namen: Quadrat, Rechteck, Dreieck, Kreis. Körper sind dreidimensional: Würfel, Quader, Kugel, Zylinder, Kegel, Pyramide.","<b>Umfang</b> = Länge der Außenlinie. <b>Fläche</b> = wie viel Platz drin ist. Rechteck: U = 2 · (a + b), A = a · b. Quadrat: U = 4a, A = a². Dreieck: A = Grundseite · Höhe / 2. <b>Körper</b>: Würfel hat 6 Flächen, 12 Kanten, 8 Ecken.","<div class=\"ex\">Rechteck 6 cm × 4 cm:<br>A = 6 · 4 = <b>24 cm²</b><br>U = 2 · (6 + 4) = <b>20 cm</b></div>","Dreieck = halbes Rechteck. Zusammengesetzte Flächen in einfache Formen zerlegen.","Umfang und Fläche verwechseln. Beim Dreieck das „durch 2“ vergessen. Flächen haben cm², nicht cm.","Umfang: außen herum. Fläche: drin. Dreieck: halbe Grundseite mal Höhe.");
K_("kreis","Der Kreis ist die Form ohne Ecken. Alle Punkte auf dem Rand sind gleich weit vom Mittelpunkt entfernt (der Radius).","Der <b>Durchmesser</b> d ist doppelt so lang wie der <b>Radius</b> r. Die Kreiszahl <b>π ≈ 3,14</b> ist das Verhältnis von Umfang zu Durchmesser. <b>Umfang U = 2 · π · r = π · d</b>. <b>Fläche A = π · r²</b>. Bei einem Kreisausschnitt rechnest du nur den Bruchteil.","<div class=\"ex\">r = 5 cm:<br>U = 2 · 3,14 · 5 = <b>31,4 cm</b><br>A = 3,14 · 25 = <b>78,5 cm²</b></div>","Merke: A hat das r zweimal (r · r), U nur einmal. Beim Durchmesser erst halbieren.","Radius und Durchmesser verwechseln.","U = 2πr, A = πr².");
K_("volumen","Das Volumen sagt, wie viel in einen Körper hineinpasst. Es wird in cm³, dm³ oder m³ gemessen.","Quader: V = a · b · c. Würfel: V = a³. Prisma/Zylinder: <b>V = Grundfläche · Höhe</b>. Pyramide/Kegel: V = Grundfläche · Höhe / 3. Die <b>Oberfläche</b> ist die Summe aller Flächen. Umrechnen: 1 dm³ = 1 l = 1000 cm³.","<div class=\"ex\">Quader 4 · 3 · 5 cm:<br>V = 60 cm³<br>O = 2 · (12 + 20 + 15) = 94 cm²</div>","Prisma/Zylinder: Grundfläche mal Höhe, dieselbe Formel für alle.","cm², cm³ vertauschen. Vergessen, dass bei Pyramiden durch 3 geteilt wird.","V = Grundfläche · Höhe.");
K_("winkel","Winkel misst du in Grad (°). Ein rechter Winkel hat 90°, eine gerade Linie 180°, ein ganzer Kreis 360°.","Winkelarten: <b>spitz</b> (&lt; 90°), <b>rechtwinklig</b> (90°), <b>stumpf</b> (90°–180°), <b>gestreckt</b> (180°). Im Dreieck sind die Winkel zusammen 180°, im Viereck 360°. <b>Nebenwinkel</b> ergeben 180°, <b>Scheitelwinkel</b> sind gleich groß. Bei Parallelen: <b>Stufenwinkel</b> und <b>Wechselwinkel</b> sind gleich.","<div class=\"ex\">α = 50°, β = 70° → γ = 180° − 50° − 70° = <b>60°</b></div>","Gleichschenkliges Dreieck: zwei gleiche Basiswinkel. Gleichseitiges: alle 60°.","Winkelsumme falsch: Dreieck 180°, nicht 360°.","Dreieck 180°, Viereck 360°.");
K_("pyth","Im rechtwinkligen Dreieck gilt a² + b² = c². Das ist der Satz des Pythagoras. c ist die längste Seite (Hypotenuse).","Die Katheten a und b liegen am rechten Winkel, die <b>Hypotenuse</b> c liegt gegenüber. Es gilt <b>a² + b² = c²</b>. Umgestellt: c = √(a² + b²), a = √(c² − b²). Mit dem <b>Kehrsatz</b> prüfst du, ob ein Dreieck rechtwinklig ist. In der <b>Trigonometrie</b>: sin α = Gegenkathete/Hypotenuse, cos α = Ankathete/Hypotenuse, tan α = Gegenkathete/Ankathete.","<div class=\"ex\">a = 3, b = 4:<br>c² = 9 + 16 = 25 → c = <b>5</b><br>sin 30° = 0,5, cos 60° = 0,5, tan 45° = 1</div>","Pythagoreische Zahlentripel: 3-4-5, 5-12-13, 8-15-17 (und deren Vielfache).","Die Wurzel am Ende vergessen. Hypotenuse mit einer Kathete verwechseln (c steht allein).","a² + b² = c², wobei c die längste Seite ist.");
K_("vektor","Ein Vektor ist ein Pfeil: Er hat eine Richtung und eine Länge. In Koordinaten schreibt man ihn als Spalte (x | y).","<b>Addieren</b>: Komponenten einzeln addieren. <b>Vervielfachen</b>: jede Komponente mit der Zahl malnehmen. <b>Betrag</b> (Länge): |v| = √(x² + y²) (im Raum mit z²). <b>Verbindungsvektor</b> von A nach B: B − A. Zwei Vektoren sind <b>parallel</b>, wenn der eine ein Vielfaches des anderen ist.","<div class=\"ex\">A(1|2), B(4|6)<br>AB = (3|4), |AB| = √(9+16) = <b>5</b></div>","Immer Ende minus Anfang: B − A.","Anfang und Ende vertauschen (Vorzeichen kehrt sich um).","Verbindungsvektor = Spitze minus Fuß.");
K_("diagramm","Diagramme zeigen Zahlen als Bilder. Der Mittelwert ist die „durchschnittliche“ Zahl.","<b>Mittelwert</b> = Summe aller Werte : Anzahl. <b>Median</b> = mittlerer Wert, wenn man sortiert hat. <b>Modus</b> = häufigster Wert. <b>Spannweite</b> = größter minus kleinster Wert. Diagrammarten: Balken, Linien (Verlauf), Kreis (Anteile).","<div class=\"ex\">Noten 2, 3, 3, 4, 5<br>Mittelwert: 17 : 5 = <b>3,4</b><br>Median: <b>3</b>, Modus: <b>3</b></div>","Beim Median erst sortieren. Bei gerader Anzahl: Mittelwert der beiden mittleren Zahlen.","Mittelwert und Median verwechseln. Die Anzahl falsch zählen.","Mittelwert = Summe geteilt durch Anzahl.");
K_("wahrsch","Wahrscheinlichkeit sagt, wie sicher ein Ereignis ist. Sie liegt zwischen 0 (unmöglich) und 1 (sicher).","<b>Laplace</b>: P = günstige Fälle / mögliche Fälle. <b>Baumdiagramm</b>: Wahrscheinlichkeiten entlang eines Pfades <b>multiplizieren</b>, verschiedene Pfade zum selben Ergebnis <b>addieren</b>. <b>Zählen</b>: n Dinge in Reihenfolge anordnen = n! Möglichkeiten (3! = 6).","<div class=\"ex\">Würfel: P(gerade Zahl) = 3/6 = <b>1/2</b><br>Zwei Münzen beide Kopf: 1/2 · 1/2 = <b>1/4</b></div>","Gegenereignis: P(mindestens einmal) = 1 − P(keinmal).","Wahrscheinlichkeiten verschiedener Pfade multiplizieren statt addieren.","Entlang des Pfades mal, nebeneinander plus.");
K_("gleichung","Eine Gleichung ist wie eine Waage: Beide Seiten sind gleich schwer. Was du links machst, machst du auch rechts.","Ziel: x allein auf eine Seite bringen. Mit <b>Äquivalenzumformungen</b> (auf beiden Seiten dasselbe): plus, minus, mal, geteilt. Reihenfolge: erst Zahlen ohne x wegschaffen (Plus/Minus), dann den Faktor vor x (Mal/Geteilt). Mit <b>Probe</b> prüfst du: Setze x ein.","<div class=\"ex\">3x + 5 = 20<br>3x = 15 (− 5)<br>x = <b>5</b> (: 3)<br>Probe: 3 · 5 + 5 = 20 ✓</div>","Stehen x auf beiden Seiten, bringe zuerst alle x auf eine Seite.","Nur eine Seite verändern. Das Vorzeichen beim Umstellen vergessen.","Was links geschieht, geschieht rechts.");
K_("terme","Ein Term ist ein Rechenausdruck mit Zahlen und Buchstaben. Du darfst gleichartige Glieder zusammenfassen.","Gleichartig sind Glieder mit gleicher Variable und Potenz (3x und 5x, aber nicht 3x und 3x²). <b>Ausmultiplizieren</b>: a · (b + c) = ab + ac. <b>Ausklammern</b> ist die Umkehrung: ab + ac = a · (b + c). Beim Minus vor der Klammer drehen sich alle Vorzeichen um.","<div class=\"ex\">4x + 3 − x + 2 = <b>3x + 5</b><br>5 · (x − 2) = <b>5x − 10</b><br>−(a − 3) = <b>−a + 3</b></div>","Erst Klammern auflösen, dann zusammenfassen.","Beim Ausmultiplizieren nur das erste Glied malnehmen. x + x ist 2x, nicht x².","a(b + c) = ab + ac.");
K_("lgs","Ein Gleichungssystem hat zwei Unbekannte (x und y) und zwei Gleichungen, die gleichzeitig stimmen müssen.","Drei Verfahren: <b>Einsetzen</b> (eine Gleichung nach x oder y umstellen und in die andere einsetzen), <b>Gleichsetzen</b> (beide nach y umstellen und gleichsetzen), <b>Additionsverfahren</b> (Gleichungen so malnehmen, dass beim Addieren eine Variable wegfällt). Grafisch ist die Lösung der <b>Schnittpunkt</b> zweier Geraden.","<div class=\"ex\">x + y = 5<br>x − y = 1<br>Addieren: 2x = 6 → x = 3, y = 2</div>","Hast du x, setze es in eine Gleichung ein und rechne y aus. Dann Probe in BEIDEN Gleichungen.","Nur eine Variable ausrechnen und aufhören. Probe vergessen.","Zwei Unbekannte brauchen zwei Gleichungen.");
K_("quad","Quadratische Gleichungen haben x². Die Lösungskurve ist eine Parabel. Es gibt höchstens zwei Lösungen.","Form: <b>ax² + bx + c = 0</b>. <b>Mitternachtsformel</b>: x = (−b ± √(b² − 4ac)) / (2a). Die <b>Diskriminante</b> D = b² − 4ac: D &gt; 0 zwei, D = 0 eine, D &lt; 0 keine Lösung. <b>pq-Formel</b> (a = 1): x = −p/2 ± √((p/2)² − q). <b>Satz von Vieta</b>: x₁ + x₂ = −p, x₁ · x₂ = q. Scheitelpunkt der Parabel: x = −b/(2a).","<div class=\"ex\">x² − 5x + 6 = 0<br>Vieta: Summe 5, Produkt 6 → x = <b>2</b> oder <b>3</b></div>","Erst Ausklammern oder binomische Formeln versuchen, oft geht es schneller.","Vorzeichen von p oder b falsch. Zuerst auf Normalform = 0 bringen.","Zwei Lösungen, eine oder keine: die Diskriminante entscheidet.");
K_("binom","Die binomischen Formeln helfen beim Ausmultiplizieren und Faktorisieren von Klammern.","<b>(a + b)² = a² + 2ab + b²</b>, <b>(a − b)² = a² − 2ab + b²</b>, <b>(a + b)(a − b) = a² − b²</b>. Von rechts nach links benutzt man sie zum <b>Faktorisieren</b> und für die <b>quadratische Ergänzung</b>. Auch für Kopfrechnen: 21² = (20 + 1)² = 400 + 40 + 1 = 441.","<div class=\"ex\">(x + 4)² = x² + 8x + 16<br>x² − 25 = (x + 5)(x − 5)</div>","Das Doppelte Produkt 2ab ist die Mitte. Wurzeln aus dem ersten und letzten Glied ziehen und prüfen, ob die Mitte passt.","(a + b)² ist NICHT a² + b². Die Mitte 2ab fehlt oft.","(a ± b)² hat immer ein Doppeltes Produkt in der Mitte.");
K_("linear","Eine lineare Funktion ist eine gerade Linie: y = m · x + b. m ist die Steigung, b der Startwert auf der y-Achse.","<b>Steigung m</b> = Δy / Δx (Höhe geteilt durch Breite). <b>y-Achsenabschnitt b</b>: dort schneidet die Gerade die y-Achse. <b>Nullstelle</b>: m · x + b = 0 → x = −b/m. Eine Gerade durch zwei Punkte: erst m aus den Punkten, dann b durch Einsetzen eines Punktes. Parallele Geraden haben gleiches m.","<div class=\"ex\">P(1|3), Q(3|7)<br>m = (7 − 3) / (3 − 1) = 2<br>b = 3 − 2 · 1 = 1<br>y = <b>2x + 1</b></div>","Steigung zeichnen: nach rechts 1, nach oben m.","Steigung als Δx/Δy statt Δy/Δx. Vorzeichen bei m negativ vergessen.","y = mx + b: m Steigung, b Startwert.");
K_("ableit","Die Ableitung sagt, wie steil eine Kurve an einer Stelle ist. Das Integral ist die Fläche unter der Kurve.","<b>Potenzregel</b>: (xⁿ)′ = n · xⁿ⁻¹. Konstanten fallen weg. <b>Summenregel</b>: gliedweise ableiten. <b>Extremstellen</b>: f′(x) = 0, dann mit f″ prüfen (f″ &lt; 0 Hochpunkt, f″ &gt; 0 Tiefpunkt). <b>Integral</b>: ∫xⁿ dx = xⁿ⁺¹ / (n+1) + C. Bestimmtes Integral = F(b) − F(a).","<div class=\"ex\">f(x) = x³ − 3x<br>f′(x) = 3x² − 3 = 0 → x = ±1<br>∫₀² x² dx = 8/3</div>","Beim Ableiten: Exponent nach vorne, Exponent um 1 kleiner. Beim Integrieren umgekehrt.","Konstante beim Ableiten nicht weglassen. Beim Integrieren das +C vergessen.","Ableiten: Exponent runter. Integrieren: Exponent rauf.");
K_("zins","Zinsen sind der Preis für geliehenes Geld. Wer Geld anlegt, bekommt Zinsen.","<b>Jahreszinsen Z = K · p/100</b>. Für Monate: Z = K · p/100 · m/12. <b>Zinseszins</b>: Die Zinsen werden mit verzinst: <b>Kₙ = K · (1 + p/100)ⁿ</b>. Der Wachstumsfaktor ist 1 + p/100 (bei 3 % also 1,03).","<div class=\"ex\">1 000 €, 5 % Zinseszins, 3 Jahre:<br>1000 · 1,05³ ≈ <b>1 157,63 €</b></div>","Faustregel: Verdoppelungszeit ≈ 72 : p (bei 6 % etwa 12 Jahre).","Zinsen und Endkapital verwechseln. Beim Zinseszins nur einfach rechnen.","Kₙ = K · (1 + p/100)ⁿ.");
K_("expo","Exponentielles Wachstum: In jedem Schritt wird mit demselben Faktor multipliziert. Der Logarithmus kehrt das um.","<b>f(x) = a · bˣ</b>: a ist der Startwert, b der Wachstumsfaktor (b &gt; 1 Wachstum, 0 &lt; b &lt; 1 Zerfall). <b>Logarithmus</b>: log_b(y) = x bedeutet bˣ = y. Gesetze: log(u·v) = log u + log v, log(uʳ) = r · log u. <b>Halbwertszeit</b>: Zeit, in der sich eine Menge halbiert.","<div class=\"ex\">2ˣ = 32 → x = log₂ 32 = <b>5</b><br>80 g, Halbwertszeit: nach 3 Zeiten 80 : 8 = <b>10 g</b></div>","Gleiche Basis erkennen: 32 = 2⁵. Sonst mit dem Taschenrechner (ln oder lg).","Exponentiell ist nicht dasselbe wie linear: Es wächst immer schneller.","Exponentiell: mal Faktor. Linear: plus Betrag.");
K_("stellenwert","Jede Ziffer hat einen Platz: Einer, Zehner, Hunderter, Tausender. Der Platz bestimmt, wie viel die Ziffer wert ist.","In 3 524 stehen 3 Tausender, 5 Hunderter, 2 Zehner und 4 Einer. Die 5 bedeutet hier 500. Die Null ist ein <b>Platzhalter</b> (in 304 stehen keine Zehner). Das System heißt <b>Stellenwertsystem</b>; nach rechts wird jede Stelle 10-mal kleiner.","<div class=\"ex\">3 524 = 3000 + 500 + 20 + 4</div>","Mit der Stellenwerttafel (T, H, Z, E) kannst du jede Zahl einordnen.","Die Null weglassen (304 ist nicht 34).","Eine Ziffer ist so viel wert wie ihre Stelle.");
K_("klammer","Es gibt eine Reihenfolge beim Rechnen: Klammern zuerst, dann Punkt (mal, geteilt) vor Strich (plus, minus).","<b>1.</b> Klammern, <b>2.</b> Potenzen, <b>3.</b> Mal und Geteilt (von links nach rechts), <b>4.</b> Plus und Minus (von links nach rechts). Mit Klammern kannst du die Reihenfolge ändern.","<div class=\"ex\">3 + 4 · 2 = 3 + 8 = 11<br>(3 + 4) · 2 = 7 · 2 = 14</div>","Unterstreiche zuerst die Mal- und Geteilt-Aufgaben.","Von links nach rechts rechnen, obwohl Punkt vor Strich gilt.","Klammer, dann Punkt vor Strich.");
K_("folgen","Eine Folge ist eine Liste von Zahlen mit Muster. Du sollst die Regel finden und weiterrechnen.","<b>Arithmetisch</b>: gleicher Abstand d, aₙ = a₁ + (n − 1) · d. <b>Geometrisch</b>: gleicher Faktor q, aₙ = a₁ · qⁿ⁻¹. Bekannte Folgen: Quadratzahlen, Dreieckszahlen (1, 3, 6, 10), Fibonacci (1, 1, 2, 3, 5, 8). Summe einer arithmetischen Folge: n · (a₁ + aₙ) / 2.","<div class=\"ex\">3, 7, 11, 15 → d = 4, nächste Zahl 19<br>2, 6, 18, 54 → q = 3, nächste 162</div>","Rechne die Unterschiede, dann die Verhältnisse. Wenn beides nicht gleich ist, schau auf die Unterschiede der Unterschiede.","Nur das erste Paar anschauen. Das Muster mit mehreren Zahlen prüfen.","Gleicher Abstand = arithmetisch, gleicher Faktor = geometrisch.");
K_("textaufg","Eine Textaufgabe ist eine kleine Geschichte mit Zahlen. Du suchst, was bekannt ist und was gefragt wird.","Vorgehen: <b>1. Lesen</b> (zweimal). <b>2. Gegeben</b> unterstreichen. <b>3. Gesucht</b> markieren. <b>4. Rechenweg</b> überlegen: plus (dazu), minus (weg), mal (gleiche Mengen), geteilt (verteilen). <b>5. Rechnen</b>, <b>6. Antwortsatz</b>, <b>7. Probe</b>: Passt das Ergebnis zur Geschichte?","<div class=\"ex\">Mia hat 5 Tüten mit je 8 Murmeln.<br>Gegeben: 5 und 8. Gesucht: alle Murmeln.<br>5 · 8 = 40 → <b>Mia hat 40 Murmeln.</b></div>","Mache eine Skizze. Setze kleine Zahlen ein, wenn du unsicher bist.","Einfach alle Zahlen im Text rechnen. Manche Zahlen sind unwichtig.","Gegeben, gesucht, Rechnung, Antwortsatz, Probe.");

/* Endlos-Mix aus allen passenden Themen */
function makeMix(sid){
  const recent=[];
  const t={id:"mix-"+(sid||"alle"),subj:sid||"lern",name:sid?"Mix: "+subjName(sid):"Alles-Mix",ic:"♾️",endless:true,explain:"",
    back:()=>uebungPage(),
    gen(k){
      const list=topicsFor(k,sid).filter(x=>x.gen&&x.id!==t.id);
      for(let i=0;i<8;i++){
        const tt=pick(list);let q;
        try{q=tt.gen(k);}catch(e){continue;}
        const key=String(q.q);
        if(!recent.includes(key)||i===7){recent.push(key);if(recent.length>25)recent.shift();return Object.assign(q,{topicName:tt.name,topicId:tt.id});}
      }
      return list[0].gen(k);
    }};
  return t;
}

/* Übungen aus dem Internet: Lückentexte aus Klexikon/Wikipedia */
function buildCloze(text){
  const sents=text.replace(/\n+/g," ").replace(/([.!?])\s+(?=[A-ZÄÖÜ])/g,"$1\n").split("\n").map(s=>s.trim())
    .filter(s=>s.length>=45&&s.length<=230&&!/[=<>{}|\[\]]/.test(s)&&(s.match(/\d/g)||[]).length<6);
  const set=new Set();sents.forEach(s=>(s.match(/[A-Za-zÄÖÜäöüß]{6,}/g)||[]).forEach(w=>set.add(w)));
  const all=[...set],pool=[];
  sents.forEach(s=>{
    const ms=[...s.matchAll(/[A-Za-zÄÖÜäöüß]{6,}/g)].filter(m=>m.index>0);
    shuffle(ms).slice(0,3).forEach(m=>pool.push({s,w:m[0],i:m.index}));
  });
  return{pool,all};
}
async function webQuiz(term,src){
  term=(term||"").trim();if(!term)return;
  markTab("uebung");BACKFN=()=>uebungPage();
  if(!isOnline()){app.innerHTML=`<button class="back" id="bk">← Zurück</button><div class="card"><h2>🌐 Kein Internet</h2><p>Für diese Übung brauche ich Internet. Die anderen Übungen funktionieren auch ohne.</p></div>`;document.getElementById("bk").onclick=uebungPage;return;}
  app.innerHTML=`<div class="card"><h2>🌐 Übungen werden gebaut …</h2><p>Ich lese gerade Texte zu „${esc(term)}“ und mache daraus Aufgaben.</p></div>`;
  let text="",title="",used="";
  try{
    for(const s of (src?[src]:["klexikon","wikipedia"])){
      const l=await wikiSearch(s,term);
      for(const r of l.slice(0,2)){
        const tx=await wikiPage(s,r.title);
        if(tx&&tx.length>500){text=tx;title=r.title;used=s;break;}
      }
      if(text)break;
    }
  }catch(e){}
  const {pool,all}=buildCloze(text);
  if(pool.length<4){
    app.innerHTML=`<button class="back" id="bk">← Zurück</button><div class="card"><h2>😕 Nichts gefunden</h2><p>Zu „${esc(term)}“ konnte ich keinen passenden Text laden. Versuche ein anderes Wort oder eine andere Quelle.</p></div>`;
    document.getElementById("bk").onclick=uebungPage;return;
  }
  let deck=[];
  const t={id:"web-"+norm(term),subj:S||"lern",name:"Internet-Übung: "+term,ic:"🌐",endless:true,explain:"",back:()=>uebungPage(),
    gen(){
      if(!deck.length)deck=shuffle(pool);
      const p=deck.pop();
      const blank=p.s.slice(0,p.i)+"_____"+p.s.slice(p.i+p.w.length);
      const up=/^[A-ZÄÖÜ]/.test(p.w);
      const cand=shuffle(all.filter(w=>w!==p.w&&/^[A-ZÄÖÜ]/.test(w)===up&&Math.abs(w.length-p.w.length)<=4)).slice(0,3);
      const src=`<br><small>Quelle: ${WIKIS[used].name} – ${esc(title)} (CC BY-SA)</small>`;
      const q=`Welches Wort fehlt in der Lücke?<div class="clz">${esc(blank)}</div>${src}`;
      if(Math.random()<.25)return mkT(`Schreibe das fehlende Wort.<div class="clz">${esc(blank)}</div>${src}`,p.w,`Das Wort beginnt mit „${p.w[0]}“ und hat ${p.w.length} Buchstaben.`,false);
      return mkC(q,p.w,cand,`Das Wort beginnt mit „${p.w[0]}“ und hat ${p.w.length} Buchstaben.`);
    }};
  quiz(t);
}

function lernstandPage(){
  markTab("mehr");BACKFN=()=>mehrPage();

  const stars=Object.keys(store).filter(k=>k.includes("@")).reduce((a,k)=>a+(store[k].stars||0),0);
  const bySubj={};
  Object.keys(store.stat).forEach(id=>{const t=ALL.find(x=>x.id===id);if(!t)return;const o=bySubj[t.subj]||(bySubj[t.subj]={r:0,f:0});o.r+=store.stat[id].r;o.f+=store.stat[id].f;});

  const weak=Object.keys(store.stat).map(id=>({id,t:ALL.find(x=>x.id===id),s:store.stat[id]})).filter(x=>x.t&&x.s.r+x.s.f>=5&&rateOf(x.s)<75).sort((a,b)=>rateOf(a.s)-rateOf(b.s)).slice(0,6);
  const rs=RSTOPICS.map(id=>({id,t:ALL.find(x=>x.id===id),s:store.stat[id]})).filter(x=>x.t&&x.s&&x.s.r+x.s.f>0);

  const rsRows=rs.map(x=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>${x.t.ic} ${x.t.name}</span><b>${rateOf(x.s)} %</b></div>${bar(rateOf(x.s),rateOf(x.s)>=75?"var(--ok)":"var(--warn)")}</div>`).join("");

  ${subjRows?`<h3 class="group">Nach Fächern</h3><div class="card">${subjRows}</div>`:`<div class="card"><p style="margin:0">Noch keine Auswertung. Löse ein paar Aufgaben, dann siehst du hier deinen Fortschritt.</p></div>`}
  ${weak.length?`<h3 class="group">Das solltest du noch üben</h3>${weak.map(x=>`<button class="resitem" data-w="${x.id}"><b>${x.t.ic} ${x.t.name}</b><span>${rateOf(x.s)} % richtig bei ${x.s.r+x.s.f} Aufgaben</span></button>`).join("")}<div class="row" style="margin-top:10px"><button class="btn" id="wmix">♾️ Schwächen-Mix starten</button></div>`:""}
  ${rs.length?`<h3 class="group">Lesen und Rechtschreibung: Auswertung</h3><div class="card">${rsRows}${rsOk.length>=2?`<p style="margin-bottom:0"><b>Läuft am besten:</b> ${rsOk[0].t.name} (${rateOf(rsOk[0].s)} %).<br><b>Braucht mehr Übung:</b> ${rsOk[rsOk.length-1].t.name} (${rateOf(rsOk[rsOk.length-1].s)} %).</p>`:`<p style="margin-bottom:0;color:var(--mute)">Nach 10 Aufgaben pro Methode zeige ich dir, was am besten klappt.</p>`}</div>`:""}`;
  document.getElementById("bk").onclick=()=>mehrPage();
  app.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{const t=ALL.find(x=>x.id===b.dataset.w);S=t.subj;markTab("lernen");topicPage(t.id);});
  const wm=document.getElementById("wmix");
  if(wm)wm.onclick=()=>{const ts=weak.map(x=>x.t).filter(t=>t.gen);
    startEndless({id:"mix-schwaechen",subj:"lern",name:"Schwächen-Mix",ic:"🎯",back:()=>lernstandPage(),gen(k){const t=pick(ts);return Object.assign(t.gen(K===null?t.from:Math.min(Math.max(K,t.from),t.to)),{topicId:t.id});}});};
  window.scrollTo(0,0);
}

BK("b1","Mia und der Ball",1,"⚽",["Mia hat einen Ball. Der Ball ist rot.","Mia wirft den Ball. Der Ball rollt weg.","Der Hund Rex sieht den Ball. Rex rennt los.","Rex bringt den Ball zurück. Mia lacht.","Jetzt spielen Mia und Rex zusammen."],[["Welche Farbe hat der Ball?","rot","blau","gelb"],["Wer bringt den Ball zurück?","Rex","Mia","Papa"],["Was macht Mia am Ende?","Sie spielt mit Rex.","Sie schläft.","Sie isst."]]);
BK("b2","Im Zoo",1,"🦁",["Heute sind wir im Zoo. Der Zoo ist groß.","Der Löwe schläft in der Sonne. Er ist sehr groß.","Die Affen klettern auf den Baum. Sie sind laut.","Der Elefant trinkt Wasser. Er hat eine lange Nase.","Am Ende essen wir ein Eis. Der Tag war schön."],[["Wo sind wir heute?","im Zoo","in der Schule","im Park"],["Was macht der Löwe?","Er schläft.","Er trinkt.","Er klettert."],["Was essen wir am Ende?","ein Eis","einen Apfel","eine Suppe"]]);
BK("b3","Das Wetter",1,"🌦️",["Heute scheint die Sonne. Ich spiele draußen.","Dann kommen Wolken. Es wird grau.","Es regnet. Ich laufe nach Hause.","Ich ziehe trockene Socken an. Mama macht Tee.","Der Regen hört auf. Ein Regenbogen steht am Himmel."],[["Was passiert zuerst?","Die Sonne scheint.","Es regnet.","Es schneit."],["Was macht Mama?","Sie macht Tee.","Sie malt.","Sie schläft."],["Was steht am Ende am Himmel?","ein Regenbogen","der Mond","ein Flugzeug"]]);
BK("b4","Der kleine Igel Ilo",2,"🦔",["Ilo ist ein kleiner Igel. Er wohnt unter einem großen Busch im Garten. Jeden Abend geht er auf die Suche nach Futter.","Heute findet er einen Apfel. Der Apfel ist rund und rot. Ilo möchte ihn nach Hause rollen, aber der Apfel ist viel zu schwer.","Da kommt die Maus Mimi vorbei. „Soll ich dir helfen?“, fragt sie. Gemeinsam schieben sie den Apfel über das Gras.","Am Busch angekommen, teilen die beiden den Apfel. Ilo sagt: „Danke, Mimi! Allein hätte ich das nicht geschafft.“","Seit diesem Abend sind Ilo und Mimi Freunde. Sie suchen jetzt immer zusammen nach Futter."],[["Wo wohnt Ilo?","unter einem Busch","in einem Haus","auf einem Baum"],["Warum kann Ilo den Apfel nicht allein tragen?","Er ist zu schwer.","Er ist zu klein.","Er ist faul."],["Wer hilft Ilo?","die Maus Mimi","der Hund","die Katze"],["Was machen die beiden am Ende?","Sie teilen den Apfel.","Sie werfen ihn weg.","Sie verstecken ihn."]]);
BK("b5","Opas Fahrrad",2,"🚲",["Opa hat ein altes Fahrrad. Es steht seit vielen Jahren in der Garage. Die Reifen sind platt und die Kette ist rostig.","Am Samstag besucht Tom seinen Opa. „Wollen wir das Fahrrad reparieren?“, fragt Tom. Opa lächelt und holt sein Werkzeug.","Zuerst pumpen sie die Reifen auf. Dann ölen sie die Kette. Tom putzt den Rahmen, bis er wieder glänzt.","Am Abend fährt Opa die erste Runde durch den Hof. „Wie früher!“, ruft er. Tom klatscht und freut sich.","Von nun an fahren die beiden jeden Samstag zusammen eine Runde."],[["Wo steht das Fahrrad?","in der Garage","im Keller","im Garten"],["Was machen sie zuerst?","Sie pumpen die Reifen auf.","Sie streichen das Rad.","Sie kaufen eine Klingel."],["Wann fahren Tom und Opa jetzt?","jeden Samstag","jeden Tag","nie"]]);
BK("b6","Der Regentag",2,"☔",["Es regnet schon den ganzen Morgen. Lena sitzt am Fenster und sieht die Tropfen am Glas hinunterlaufen. Ihr ist langweilig.","„Wir bauen eine Höhle!“, sagt ihr Bruder Jan. Er holt Decken und Kissen aus dem Wohnzimmer. Gemeinsam spannen sie die Decken über zwei Stühle.","In der Höhle ist es warm und gemütlich. Jan holt eine Taschenlampe, Lena ein Buch. Sie lesen sich abwechselnd Seite für Seite vor.","Als die Sonne wieder herauskommt, wollen die beiden gar nicht mehr hinaus. „Vielleicht bleiben wir noch ein bisschen“, sagt Lena."],[["Wie ist das Wetter am Morgen?","Es regnet.","Die Sonne scheint.","Es schneit."],["Was bauen die Kinder?","eine Höhle","ein Haus","einen Turm"],["Was machen sie in der Höhle?","Sie lesen.","Sie malen.","Sie schlafen."]]);
BK("b7","Das Geheimnis im Garten",3,"🌱",["Jeden Morgen ging Emma durch den Garten ihrer Großmutter. Er war nicht besonders groß, aber er war voller Überraschungen: bunte Blumen, ein kleiner Teich und eine alte Holzbank unter dem Apfelbaum.","An diesem Morgen bemerkte sie etwas Neues. Hinter der Bank, halb unter Efeu versteckt, lag ein kleines Metallkästchen. Es war rostig und schwer. Emma kniete sich hin und zog es vorsichtig hervor.","„Oma, schau mal, was ich gefunden habe!“, rief sie. Die Großmutter kam langsam näher und betrachtete das Kästchen lange. Dann wurde ihr Blick weich. „Das habe ich vor vielen Jahren vergraben“, sagte sie leise.","Zusammen öffneten sie den Deckel. Darin lagen ein paar Briefe, ein getrocknetes Kleeblatt und ein Foto von zwei lachenden Mädchen. „Das bin ich“, erklärte die Großmutter, „und neben mir steht meine beste Freundin Greta.“","Emma durfte alle Briefe lesen. Sie erzählten von Streichen, Geheimnissen und einem Sommer, den die beiden Mädchen nie vergessen wollten. Am Abend schrieb Emma selbst einen Brief. Sie legte ihn in das Kästchen und vergrub es wieder, tief unter dem Apfelbaum."],[["Wo fand Emma das Kästchen?","hinter der Holzbank","im Teich","im Haus"],["Wer hatte das Kästchen vergraben?","die Großmutter","Emmas Vater","Greta allein"],["Was lag in dem Kästchen?","Briefe, ein Kleeblatt und ein Foto","Geld und Schmuck","Spielzeug"],["Was tat Emma am Abend?","Sie schrieb einen Brief und vergrub das Kästchen.","Sie warf das Kästchen weg.","Sie verkaufte es."]]);
BK("b8","Die Schatzkarte",3,"🗺️",["Auf dem Dachboden entdeckte Paul zwischen alten Zeitungen eine zusammengerollte Karte. Sie war vergilbt, an den Rändern eingerissen und mit roter Tinte beschriftet. Mitten im Papier prangte ein großes Kreuz.","Paul rannte zu seiner Schwester Nora. „Das ist eine echte Schatzkarte!“, rief er. Nora lachte zuerst, doch dann entdeckte sie den Namen unseres Dorfes in der Ecke. „Vielleicht stimmt es ja“, murmelte sie.","Sie folgten den Zeichen: vom alten Brunnen zehn Schritte nach Norden, dann bis zur großen Eiche und dort drei Schritte nach Westen. Unter einer flachen Wurzel schimmerte etwas Metallisches.","Mit einer kleinen Schaufel gruben sie eine Holzkiste aus. Darin lagen keine Goldmünzen, sondern ein Fernglas, ein Kompass und ein Zettel: „Für alle, die Abenteuer lieben.“","Paul und Nora sahen sich an und grinsten. Das Fernglas passte genau in ihre Rucksäcke. Schon am nächsten Tag zogen sie los, um selbst eine neue Karte zu zeichnen."],[["Wo fand Paul die Karte?","auf dem Dachboden","im Keller","im Garten"],["Was entdeckte Nora in der Ecke der Karte?","den Namen des Dorfes","ein Bild","eine Zahl"],["Was lag in der Kiste?","ein Fernglas, ein Kompass und ein Zettel","Goldmünzen","ein Buch"],["Was planen die Kinder am Ende?","eine neue Karte zu zeichnen","das Dorf zu verlassen","die Kiste zu verkaufen"]]);
BK("b9","Der Roboter Bolt lernt lachen",4,"🤖",["Bolt war ein Roboter, der alles konnte: rechnen, Türen öffnen, Kaffee kochen und Pakete tragen. Nur eines wollte ihm nicht gelingen. Wenn die Kinder lachten, wusste er nicht, warum. In seinen Schaltkreisen gab es keine Regel dafür.","Eines Tages beschloss Bolt, das Lachen zu lernen. Er besuchte die Grundschule in der Nachbarschaft und setzte sich leise in die letzte Reihe. Die Lehrerin, Frau Sommer, nickte ihm freundlich zu und erzählte der Klasse eine lustige Geschichte über einen Hasen, der seinen eigenen Schatten für einen Dieb hielt.","Die Kinder kicherten, bis ihnen die Tränen kamen. Bolt notierte alles genau: gehobene Mundwinkel, schnelle Atmung, wackelnde Schultern. „Interessant“, murmelte er. „Aber warum tut es niemandem weh?“ Ein Mädchen namens Mira drehte sich um. „Lachen tut nicht weh“, sagte sie, „es fühlt sich an wie ein warmes Kribbeln im Bauch.“","Bolt dachte lange darüber nach. Am Abend, allein in seiner Ladestation, erinnerte er sich an den Hasen und seinen Schatten. Plötzlich begann sein Lautsprecher zu knistern. Zuerst klang es wie ein Fehler, dann wie ein Hüsteln, und schließlich brach ein Geräusch aus ihm heraus, das er noch nie gehört hatte.","Am nächsten Morgen wartete Mira vor der Schule. „Bolt, ich habe dich gestern Abend gehört“, sagte sie grinsend. „Das war ein richtiges Lachen!“ Bolts Augen leuchteten in einem warmen Gelb. Zum ersten Mal verstand er, dass manche Dinge nicht berechnet, sondern gefühlt werden müssen."],[["Was konnte Bolt nicht?","lachen","rechnen","Kaffee kochen"],["Wie erklärt Mira das Lachen?","wie ein warmes Kribbeln im Bauch","wie ein Fehler im Computer","wie Husten"],["Wann gelang Bolt das Lachen?","am Abend in der Ladestation","in der Schule","beim Kaffeekochen"],["Was versteht Bolt am Ende?","Manche Dinge werden gefühlt, nicht berechnet.","Lachen ist ein Fehler.","Roboter dürfen nie lachen."]]);
BK("b10","Die Nacht am Zeltplatz",4,"⛺",["Es war schon dunkel, als Jonas und seine Freunde die Zelte am See aufgebaut hatten. Das Lagerfeuer knisterte, und über ihnen funkelten tausend Sterne. Niemand wollte schlafen gehen, denn Jonas’ Vater hatte versprochen, eine Gruselgeschichte zu erzählen.","„Vor langer Zeit“, begann er mit tiefer Stimme, „lebte in diesem Wald ein Schatten, der nachts ruhelos umherwanderte.“ Die Kinder rückten enger zusammen. Plötzlich raschelte es hinter den Büschen. Alle erstarrten.","Zwei leuchtende Augen blickten aus dem Dunkel. Sophie schrie auf, Max versteckte sich unter einer Decke. Doch dann tapste ein kleiner Igel ins Licht, schnüffelte neugierig an einem Brotkrümel und verschwand wieder im Gras.","Die Erleichterung war so groß, dass alle gleichzeitig loslachten. Jonas’ Vater schüttelte den Kopf: „So ein mutiger Schatten“, sagte er zwinkernd. Sie holten Marshmallows, steckten sie auf Stöcke und hielten sie über die Glut.","Später, im Schlafsack, lauschte Jonas den Geräuschen der Nacht: dem Rauschen der Blätter, dem leisen Plätschern des Wassers. Er dachte daran, dass das Unheimliche oft nur etwas Unbekanntes ist, und schlief mit einem Lächeln ein."],[["Wo fand der Ausflug statt?","an einem See","in den Bergen","am Meer"],["Was raschelte hinter den Büschen?","ein kleiner Igel","ein Wolf","ein Schatten"],["Was machten die Kinder nach dem Schreck?","Sie lachten und grillten Marshmallows.","Sie liefen weg.","Sie gingen nach Hause."],["Welche Erkenntnis hat Jonas?","Das Unheimliche ist oft nur unbekannt.","Wald ist gefährlich.","Igel sind böse."]]);
BK("b11","Die Bibliothek der verlorenen Stimmen",5,"📚",["Am Rand der Stadt, dort wo die Straßenlaternen aufhören, stand ein Gebäude, das auf keinem Stadtplan verzeichnet war. Lena entdeckte es nur, weil sie sich verlaufen hatte. Über dem Eingang hing ein verwittertes Schild: „Bibliothek der verlorenen Stimmen“. Neugier siegte über Vernunft, und sie trat ein.","Drinnen roch es nach Staub und Pergament. Regale ragten bis in die Dunkelheit der Decke, doch statt Büchern standen dort Tausende Glasgefäße, in denen es leise flüsterte. Eine alte Frau mit silbernen Haaren trat aus dem Schatten. „Hier bewahren wir alles auf, was Menschen nicht mehr sagen wollten oder konnten“, erklärte sie. „Versprechen. Entschuldigungen. Liebeserklärungen.“","Lena ging an den Regalen entlang und blieb vor einem Gefäß stehen, das ihren Namen trug. Mit zitternden Fingern öffnete sie den Deckel. Heraus drang die Stimme ihres Großvaters, brüchig und warm: „Ich bin stolz auf dich, Lena, auch wenn ich es dir nie gesagt habe.“ Tränen liefen ihr über das Gesicht.","„Jede Stimme findet irgendwann ihren Weg zurück“, sagte die Bibliothekarin sanft. „Manchmal braucht sie nur jemanden, der zuhört.“ Als Lena das Gebäude verließ, war es draußen längst Morgen. Sie drehte sich um, doch an der Stelle, wo die Bibliothek gestanden hatte, wuchs nur noch hohes Gras.","Von diesem Tag an hörte Lena besser zu. Sie fragte nach, wenn jemand zögerte, und sagte selbst rechtzeitig, was ihr wichtig war. Denn sie hatte begriffen, dass Worte, die unausgesprochen bleiben, irgendwo weiterleben und darauf warten, dass jemand sie hört."],[["Warum fand Lena das Gebäude?","Sie hatte sich verlaufen.","Sie suchte ein Buch.","Jemand hatte sie eingeladen."],["Was bewahrt die Bibliothek auf?","Stimmen und ungesagte Worte","Alte Bücher","Gemälde"],["Wessen Stimme hörte Lena?","die ihres Großvaters","die ihrer Mutter","die einer Freundin"],["Was ändert sich in Lenas Leben?","Sie hört besser zu und sagt Wichtiges rechtzeitig.","Sie liest nur noch Bücher.","Sie zieht in eine andere Stadt."]]);
BK("b12","Ein Tag am Hafen",5,"⚓",["Der Hafen erwachte lange vor der Sonne. Schon um fünf Uhr morgens brummten die ersten Motoren, Möwen kreischten, und aus der Kantine zog der Duft von frischem Kaffee über das Kopfsteinpflaster. Jan, seit gestern Auszubildender, stand mit steifen Gliedern am Kai und wusste nicht, wohin mit seinen Händen.","„Du fängst am besten bei den Tauen an“, brummte Kapitän Henning und warf ihm ein dickes Seil zu. Jan lernte schnell, dass jeder Knoten eine Bedeutung hatte. Der Palstek hielt auch dann, wenn der Wind an der Leine riss, und ließ sich trotzdem leicht lösen. „Ein guter Knoten ist ein Versprechen“, sagte der Kapitän.","Gegen Mittag legte ein Frachter aus Rotterdam an. Kräne schwenkten, Container schwebten wie bunte Bausteine durch die Luft, und Jan staunte über die Genauigkeit, mit der die Arbeiter einander Zeichen gaben. Niemand schrie; ein Nicken oder eine Handbewegung genügte.","Am späten Nachmittag, als die Schatten länger wurden, setzte sich Jan auf einen Poller und sah dem Treiben zu. Seine Hände schmerzten, doch er fühlte sich seltsam zufrieden. Zum ersten Mal verstand er, warum seine Mutter von der Arbeit am Wasser so geschwärmt hatte.","Als er an diesem Abend nach Hause kam, schlief er schon im Sitzen ein. Im Traum hörte er noch das Rauschen der Wellen und die ruhige Stimme des Kapitäns: „Morgen zeige ich dir den Webeleinstek.“"],[["Wer ist Jan?","ein neuer Auszubildender","der Kapitän","ein Tourist"],["Was lernt Jan zuerst?","den Umgang mit Tauen","Kranfahren","Kochen"],["Woher kam der Frachter?","aus Rotterdam","aus Hamburg","aus Oslo"],["Wie fühlt sich Jan am Abend?","müde und zufrieden","enttäuscht","wütend"]]);
BK("b13","Der Brief",6,"✉️",["Als Martin den Umschlag aus dem Briefkasten zog, erkannte er die Handschrift sofort. Dreißig Jahre waren vergangen, seit er zuletzt etwas von Thomas gehört hatte, und dennoch wirkten die geschwungenen Buchstaben so vertraut wie ein altes Lied. Er setzte sich auf die Treppenstufe, ohne den Brief zu öffnen, und ließ die Erinnerungen zu.","Sie waren unzertrennlich gewesen, damals in der Lehrwerkstatt: zwei junge Männer mit schmutzigen Händen und großen Plänen. Gemeinsam hatten sie davon geträumt, eine eigene Werkstatt zu eröffnen. Doch dann kam ein Streit, über Geld, über Stolz, über Worte, die man hinterher nicht zurücknehmen konnte, und aus Freunden wurden Fremde.","„Lieber Martin“, begann der Brief, „ich weiß nicht, ob du mir verzeihen kannst, aber ich möchte zumindest versuchen, mich zu entschuldigen. Ich war ein sturer Kerl, der lieber recht behalten als einen Freund behalten wollte. Heute, mit grauen Haaren, sehe ich das anders.“","Martin las die Zeilen zweimal. Dann holte er Papier und Stift aus der Schublade. Seine Handschrift war ungelenk, die Sätze entstanden zäh. Er schrieb von der Werkstatt, die er schließlich doch allein eröffnet hatte, von seiner Tochter und davon, dass er Thomas’ Lachen oft vermisste.","Am nächsten Morgen warf er den Brief ein, bevor ihn der Mut verlassen konnte. Auf dem Heimweg spürte er eine leichte Wärme in der Brust. Vielleicht war es nicht zu spät. Vielleicht konnten manche Brücken, einmal eingestürzt, doch mit vereinten Kräften wieder aufgebaut werden, Stein für Stein und Wort für Wort."],[["Wie erkennt Martin den Absender?","an der Handschrift","am Stempel","am Namen auf dem Umschlag"],["Worüber stritten die beiden damals?","über Geld und Stolz","über ein Mädchen","über ein Auto"],["Was gesteht Thomas im Brief?","Er wollte lieber recht behalten als einen Freund behalten.","Er will Geld zurück.","Er zieht um."],["Wie endet die Geschichte?","Martin antwortet mit einem Brief und hofft auf Versöhnung.","Martin wirft den Brief weg.","Die beiden treffen sich sofort."]]);

/* ---------- Silbentrennung (Hilfe beim Lesen) ---------- */
function silben(wort){
  if(wort.indexOf("|")>=0)return wort.split("|");
  const w=wort;if(w.length<=3)return[w];
  const nuc=[];const re=/ei|ai|au|eu|äu|ie|aa|ee|oo|[aeiouäöüy]/gi;let m;
  while((m=re.exec(w)))nuc.push([m.index,m.index+m[0].length]);
  if(nuc.length<2)return[w];
  const cuts=[];
  for(let i=0;i<nuc.length-1;i++){
    const a=nuc[i][1],b=nuc[i+1][0];const cl=w.slice(a,b);
    if(!cl.length)cuts.push(a);
    else if(cl.length===1)cuts.push(a);
    else{const mm=cl.match(/(sch|ch|ck|ph|qu)$/i);cuts.push(mm?b-mm[0].length:b-1);}
  }
  const out=[];let p=0;cuts.forEach(c=>{out.push(w.slice(p,c));p=c;});out.push(w.slice(p));
  return out.filter(Boolean);
}
const bookWordsHtml=(text,withSyl)=>text.replace(/([A-Za-zÄÖÜäöüß|]+)|([^A-Za-zÄÖÜäöüß|]+)/g,(s,w,o)=>{
  if(!w)return esc(o);
  const plainW=w.replace(/\|/g,"");
  const inner=withSyl?silben(w).map((x,i)=>`<span class="sy${i%2}">${esc(x)}</span>`).join(""):esc(plainW);
  return `<span class="wd" data-w="${esc(plainW)}">${inner}</span>`;
});

function readBook(id,pg){
  const b=BOOKS.find(x=>x.id===id);stopSpeak();markTab("lesen");BACKFN=()=>booksPage();
  const syl=store.bsyl!==undefined?store.bsyl:!!b.silben;
  const last=pg>=b.pages.length-1;
  if(pg===0)window.__readStart=Date.now();
  app.innerHTML=`<button class="back" id="bk">← Bücher</button>
  <div class="card reader"><h2>${b.ic} ${esc(b.t)}</h2><div style="color:var(--mute);margin-bottom:8px">${LEVELNAME[b.lv]} · Seite ${pg+1} von ${b.pages.length}</div>
  <div id="pg" style="font-size:${store.bfs||1.25}rem;line-height:2">${bookWordsHtml(b.pages[pg],syl)}</div>
  <div class="row" style="margin-top:14px"><button class="btn small" id="ls">🔊 Vorlesen</button><button class="btn small ghost" id="sy">${syl?"Silben: an":"Silben: aus"}</button><button class="btn small ghost" id="fa">A−</button><button class="btn small ghost" id="fb">A+</button></div></div>
  <div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn ghost" id="pv" ${pg===0?"disabled":""}>← Zurück</button><button class="btn" id="nx">${last?"Fertig → Fragen":"Weiter →"}</button></div>`;
  const $=i=>document.getElementById(i);
  $("bk").onclick=booksPage;
  app.querySelectorAll(".wd").forEach(w=>w.onclick=()=>speak(w.dataset.w));
  $("ls").onclick=()=>speak(b.pages[pg].replace(/\|/g,""));
  $("sy").onclick=()=>{store.bsyl=!syl;save();readBook(id,pg);};
  $("fa").onclick=()=>{store.bfs=Math.max(.9,(store.bfs||1.25)-.15);save();readBook(id,pg);};
  $("fb").onclick=()=>{store.bfs=Math.min(2.2,(store.bfs||1.25)+.15);save();readBook(id,pg);};
  $("pv").onclick=()=>readBook(id,pg-1);
  $("nx").onclick=()=>last?bookQuiz(id):readBook(id,pg+1);
  window.scrollTo(0,0);
}
function bookQuiz(id){
  const b=BOOKS.find(x=>x.id===id);
  const secs=Math.max(1,Math.round((Date.now()-(window.__readStart||Date.now()))/1000));
  const words=b.pages.join(" ").replace(/\|/g,"").split(/\s+/).length;
  const wpm=Math.min(400,Math.round(words/secs*60));
  const t={id:"book-"+id,subj:"deutsch",name:"Fragen: "+b.t,ic:b.ic,explain:"",back:()=>booksPage(),
    reset(){this.deck=shuffle(b.q);},
    gen(){if(!this.deck||!this.deck.length)this.deck=shuffle(b.q);const x=this.deck.pop();return{q:x[0],type:"choice",choices:shuffle(x.slice(1)),answer:x[1],hint:"Lies die Stelle im Text noch einmal. Du darfst zurückblättern.",way:`Richtig ist: ${x[1]}.`,topicId:"d-lesen"};}};
  store.books=store.books||{};store.books[id]={done:true,wpm,date:Date.now()};save();
  quiz(Object.assign({},t,{bank:true,items:b.q}));
}

  const body=p.c.map(c=>c[0]==="bolt"?bolt(c[1],c[2],104,.72*(c[3]||1)):person(c[0],c[1],c[2],104,.8*(c[3]||1),!!c[4]&&c[2]>150)).join("");
  return `<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" style="width:100%;display:block;border-radius:10px">${sc}${body}</svg>`;
}
function mangaPage(){
  markTab("lesen");BACKFN=()=>lesenPage();

function readManga(id){
  const m=MANGA.find(x=>x.id===id);stopSpeak();BACKFN=()=>mangaPage();
  const all=m.panels.map(p=>[p.cap].concat(p.b.map(x=>x[1])).join(" ")).join(" ");
  app.innerHTML=`<button class="back" id="bk">← Manga</button><header class="top"><h1>${esc(m.t)}</h1></header>
  <div class="row"><button class="btn small" id="all">🔊 Alles vorlesen</button><button class="btn small ghost" id="stp">⏹ Stopp</button></div>
  ${m.panels.map((p,i)=>`<div class="mpanel"><div class="mnum">${i+1}</div>${panelSvg(p,id+i)}<div class="mcap" data-t="${esc(p.cap)}">${esc(p.cap)}</div>${p.b.map(x=>`<div class="mbub ${p.c[x[0]]&&p.c[x[0]][2]>150?"r":"l"}" data-t="${esc(x[1])}"><b>${esc({kiko:"Kiko",mira:"Mira",bolt:"Bolt",sommer:"Frau Sommer"}[(p.c[x[0]]||p.c[0])[0]])}:</b> ${esc(x[1])}</div>`).join("")}</div>`).join("")}
  <div class="card"><b>Ende der Folge.</b> Lies sie gern nochmal und achte auf Wörter, die du noch nicht kennst.</div>`;
  document.getElementById("bk").onclick=mangaPage;
  document.getElementById("all").onclick=()=>speak(all);document.getElementById("stp").onclick=stopSpeak;
  app.querySelectorAll("[data-t]").forEach(el=>el.onclick=()=>speak(el.dataset.t));
  window.scrollTo(0,0);
}

}

/* ======================================================================
   Offline-Bibliothek: gelesene Online-Texte bleiben auf dem Gerät
   (IndexedDB, Fallback: Speicher im Arbeitsspeicher)
   ====================================================================== */
const _mem={};
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("vzl_lib",1);r.onupgradeneeded=()=>r.result.createObjectStore("texts",{keyPath:"key"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
async function offlinePut(key,title,src,text){
  const rec={key,title,src,text,at:Date.now()};_mem[key]=rec;
  try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction("texts","readwrite");tx.objectStore("texts").put(rec);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}catch(e){}
  return rec;
}
async function offlineGet(key){
  if(_mem[key])return _mem[key];
  try{const db=await idb();return await new Promise((res,rej)=>{const r=db.transaction("texts").objectStore("texts").get(key);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});}catch(e){return null;}
}
async function offlineAll(){
  try{const db=await idb();return await new Promise((res,rej)=>{const r=db.transaction("texts").objectStore("texts").getAll();r.onsuccess=()=>res((r.result||[]).sort((a,b)=>b.at-a.at));r.onerror=()=>rej(r.error);});}catch(e){return Object.values(_mem);}
}
async function offlineDel(key){delete _mem[key];try{const db=await idb();await new Promise(res=>{const tx=db.transaction("texts","readwrite");tx.objectStore("texts").delete(key);tx.oncomplete=res;tx.onerror=res;});}catch(e){}}
async function offlinePage(){
  markTab("lesen");BACKFN=()=>lesenPage();
  app.innerHTML=`<button class="back" id="bk">← Lesen</button><header class="top"><h1>📥 Offline-Bibliothek</h1></header><div class="card"><p style="margin:0">Hier liegen Texte aus Wikipedia, Klexikon und Co., die du schon gelesen oder gespeichert hast. Du kannst sie lesen, vorlesen lassen und daraus Lückenaufgaben machen, auch ohne Internet.</p></div><div id="ol">Lade …</div>`;
  document.getElementById("bk").onclick=lesenPage;
  const list=await offlineAll();const box=document.getElementById("ol");
  if(!list.length){box.innerHTML=`<div class="card">Noch nichts gespeichert. Öffne in der Suche einen Text, er wird automatisch gespeichert.</div>`;return;}
  box.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn" id="cz">♾️ Lückentexte aus meinen Texten</button></div>`+list.map((x,i)=>`<div class="resitem"><b>${esc(x.title)}</b><span>${esc((WIKIS[x.src]||{name:x.src}).name)} · ${Math.round(x.text.length/1000)} Tsd. Zeichen</span><div class="row" style="margin-top:6px"><button class="btn small" data-r="${i}">Lesen</button><button class="btn small ghost" data-d="${i}">Löschen</button></div></div>`).join("");
  document.getElementById("cz").onclick=()=>clozeFromTexts(list.map(x=>({text:x.text,title:x.title,src:x.src})),"Meine Offline-Texte");
  box.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const x=list[+b.dataset.r];offlineRead(x);});
  box.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{await offlineDel(list[+b.dataset.d].key);offlinePage();});
}
function offlineRead(x){
  stopSpeak();BACKFN=()=>offlinePage();
  app.innerHTML=`<button class="back" id="bk">← Bibliothek</button><div class="card reader"><h2>${esc(x.title)}</h2><div>${x.text.slice(0,12000).split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join("")}</div><div class="row" style="margin-top:12px"><button class="btn small" id="ls">🔊 Vorlesen</button></div><p style="color:var(--mute);font-size:.8rem">Quelle: ${esc((WIKIS[x.src]||{name:x.src}).name)} – ${esc(x.title)} (CC BY-SA)</p></div>`;
  document.getElementById("bk").onclick=offlinePage;document.getElementById("ls").onclick=()=>speak(x.text.slice(0,4000));
}
/* Lückentexte endlos aus beliebigen Texten (offline) */
function clozeFromTexts(items,name,back){
  const joined=items.map(x=>x.text).join("\n");
  const {pool,all}=buildCloze(joined);
  if(pool.length<4){app.innerHTML=`<div class="card">Zu wenig Text für Aufgaben.</div>`;return;}
  let deck=[];
  const t={id:"web-offline",subj:"deutsch",name,ic:"📥",endless:true,explain:"",back:back||(()=>offlinePage()),gen(){

const isKid=()=>store.who!=="erw";
const plainW=w=>w.replace(/\|/g,"");
const wordPool=()=>(isKid()?W_KID:W_ERW.concat(W_KID.filter((_,i)=>i%3===0)));
const CONF={b:"d",d:"b",p:"q",q:"p",m:"n",n:"m",a:"o",o:"a",e:"i",i:"e",u:"o",s:"z",z:"s",g:"k",k:"g",f:"v",v:"f",t:"d",ä:"e",ö:"o",ü:"u"};
function dlLaute(){
  const w=plainW(pick(wordPool()));const idx=[];[...w].forEach((c,i)=>{if(/[a-zäöüß]/i.test(c)&&CONF[c.toLowerCase()])idx.push(i);});
  const i=idx.length?pick(idx):0;const c=w[i];const lc=c.toLowerCase();const up=c!==lc;
  const pool=Object.keys(CONF).filter(x=>x!==lc);const wr=[CONF[lc],...shuffle(pool)].filter(x=>x&&x!==lc);
  const f=x=>up?x.toUpperCase():x;
  const shown=w.slice(0,i)+"_"+w.slice(i+1);
  return mkC(`Hör zu und finde den fehlenden Buchstaben.<br><button class="btn small ghost" onclick="speak('${w}')">🔊 Wort anhören</button><div class="clz" style="font-size:1.8rem;letter-spacing:.1em">${esc(shown)}</div>`,c,wr.slice(0,3).map(f),"Sprich das Wort langsam und höre auf den Laut an der Lücke.",`Das Wort heißt: ${w}.`);
}
function dlSilben(){
  const s=pick(wordPool().filter(x=>x.indexOf("|")>0));const parts=s.split("|"),w=parts.join("");
  const m=Math.random();
  if(m<.4)return mkC(`Klatsche das Wort „${w}“. Wie viele Silben hat es?`,String(parts.length),[String(parts.length+1),String(Math.max(1,parts.length-1)),String(parts.length+2)],"Sprich langsam und klatsche bei jeder Silbe.",`${parts.join(" – ")}: ${parts.length} Silben.`);
  if(m<.75){const sh=shuffle(parts.slice());if(sh.join("|")===parts.join("|")&&parts.length>1)sh.reverse();
    const wr=others(wordPool().map(plainW),w,3);return mkC(`Setze zusammen: <b>${sh.join(" · ")}</b>. Welches Wort ist das?`,w,wr,"Probiere die Silben in verschiedener Reihenfolge, bis ein Wort klingt.",`${parts.join(" – ")} = ${w}`);}
  const wrong=parts.length>1?[parts.slice(0,-1).join("")+"-"+parts[parts.length-1]]:[];const p2=parts.join("-");
  const v=[];if(parts.length>=3){v.push(parts[0]+"-"+parts.slice(1).join(""));}v.push(w.slice(0,1)+"-"+w.slice(1));v.push(w.slice(0,Math.ceil(w.length/2))+"-"+w.slice(Math.ceil(w.length/2)));
  return mkC(`Wie trennt man „${w}“ in Silben?`,p2,[...wrong,...v].filter(x=>x!==p2),"Jede Silbe hat einen Selbstlaut. Sprich langsam.",`Richtig: ${p2}`);
}
function dlParse(item,rule){
  const parts=item.split("#");const hint=parts[1]||"";const m=parts[0].match(/^(.*?)\[(.+?)\](.*)$/);
  if(!m)return null;const opts=m[2].split("/");const right=opts[0];
  const shown=m[1]+"_"+(right.length>1?"_".repeat(right.length-1):"")+m[3];
  return{q:`${rule.name}: Welche Schreibweise passt?<div class="clz" style="font-size:1.6rem">${esc(m[1]+"…"+m[3])}</div>`,right,opts,hint,full:m[1]+right+m[3],m};
}
function dlRegel(ruleId){
  const r=ruleId?RULE(ruleId):pick(RULES.filter(x=>x.id!=="stamm"));
  const it=dlParse(pick(r.items),r);if(!it)return dlRegel();

  q.cardWord=it.full;q.say=it.full;q.topicId="dl-regeln";return q;
}
function dlBlitz(){

/* Fehlerkartei (Karten mit Boxen, kommen nach Plan wieder) */
const INT=[0,1,2,4,7,14];
const dayStr=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const dayPlus=n=>{const d=new Date();d.setDate(d.getDate()+n);return dayStr(d);};
store.karten=store.karten||[];
function addKarte(t){let c=store.karten.find(x=>x.t===t);if(c){c.box=1;c.due=dayPlus(INT[1]);}else store.karten.push({t,box:1,due:dayPlus(INT[1])});}
function cardResult(t,ok){const c=store.karten.find(x=>x.t===t);if(!c)return;if(ok){c.box=Math.min(5,c.box+1);c.due=dayPlus(INT[c.box]);}else{c.box=1;c.due=dayPlus(INT[1]);}}
const dueCards=()=>store.karten.filter(c=>c.due<=dayStr());
function dlKarte(){
  const d=dueCards();if(!d.length)return dlDiktat();const c=pick(d);const w=c.t;
  return mkT(`📓 Fehlerkartei: Höre und schreibe.<br><button class="btn small" onclick="speak('${w.replace(/'/g,"")}')">🔊 Anhören</button>`,w,`Das hat dir schon mal Schwierigkeiten gemacht. Sprich es in Silben: ${silben(w).join(" – ")}.`,true,{say:w,karteWord:w,topicId:"dl-karte"});
