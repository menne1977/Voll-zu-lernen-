<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Voll zu lernen</title>
<style>
:root{--bg:#f4f1ff;--card:#fff;--ink:#241b4b;--mute:#6b6590;--pri:#4f46e5;--pri2:#7c3aed;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--line:#e4defa}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:760px;margin:0 auto;padding:16px 16px 48px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header.top h1{font-size:1.35rem;margin:0;flex:1}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap}
button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:14px;padding:14px 22px;font-weight:700;font-size:1.05rem;box-shadow:0 4px 0 #3730a3}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #3730a3}
.btn.ghost{background:#fff;color:var(--pri);border:2px solid var(--line);box-shadow:none}
.btn.small{padding:8px 14px;font-size:.95rem;box-shadow:none}
.back{background:none;border:0;color:var(--pri);font-weight:700;font-size:1rem;padding:6px 0}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:22px;padding:20px;margin-bottom:18px}
.hero h2{margin:0 0 4px;font-size:1.3rem}
.bar{height:12px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:#fde047;border-radius:99px;transition:width .4s}
h3.group{margin:22px 0 8px;font-size:1rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.topic{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.topic:hover{border-color:var(--pri)}
.topic .ic{font-size:2rem}
.topic b{font-size:1.05rem}
.stars{letter-spacing:2px;font-size:1.15rem}
.stars .off{opacity:.25;filter:grayscale(1)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px}
.card h2{margin:0 0 8px}
.explain p{margin:.5em 0}
.ex{background:#f5f3ff;border-left:5px solid var(--pri);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:1.05rem}
.q{font-size:1.45rem;font-weight:700;margin:6px 0 16px}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress>i{display:block;height:100%;background:var(--pri);transition:width .3s}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input.ans{font:inherit;font-size:1.5rem;font-weight:700;width:170px;padding:12px;border:3px solid var(--line);border-radius:14px;text-align:center}
input.ans:focus{outline:none;border-color:var(--pri)}
.unit{font-size:1.3rem;font-weight:700;color:var(--mute)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.choice{background:#fff;border:3px solid var(--line);border-radius:14px;padding:14px;font-size:1.2rem;font-weight:700}
.choice:hover:not(:disabled){border-color:var(--pri)}
.choice.right{background:var(--okbg);border-color:var(--ok)}
.choice.wrong{background:var(--badbg);border-color:var(--bad);opacity:.7}
.fb{border-radius:14px;padding:12px 16px;margin-top:14px;font-size:1.05rem}
.fb.ok{background:var(--okbg);color:#14532d}
.fb.bad{background:var(--badbg);color:#7f1d1d}
.fb.tip{background:var(--warnbg);color:#78350f}
.fb b{display:block;margin-bottom:2px}
.result{text-align:center}
.result .big{font-size:3.2rem;letter-spacing:6px;margin:8px 0}
.result .score{font-size:1.4rem;font-weight:700}
svg.chart{max-width:100%;height:auto;background:#fafaff;border:2px solid var(--line);border-radius:14px;margin-bottom:12px}
.clock{display:block;margin:0 auto 10px}
.spacer{height:10px}
.footer{color:var(--mute);font-size:.85rem;text-align:center;margin-top:28px}
.fr{display:inline-block;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px}
.fr sup,.fr sub{display:block;font-size:.8em;line-height:1.1}
.fr sup{border-bottom:2px solid currentColor;padding:0 4px}
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.cls{background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.cls b{font-size:1.5rem;line-height:1.1;text-align:center}
.cls small{color:var(--mute)}
.cls:hover{border-color:var(--pri)}
.topic{color:var(--ink);font:inherit}
#app{padding-bottom:96px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:2px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
#tabs button{flex:1;background:none;border:0;color:var(--mute);font-size:.72rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:12px}
#tabs button span{font-size:1.4rem;line-height:1.1}
#tabs button.on{color:var(--pri);background:#f0edff}
.helpbar{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.sel{font:inherit;font-weight:600;padding:10px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);max-width:100%}
.ta{display:block;width:100%;min-height:90px;margin:10px 0;font:inherit;padding:10px;border:2px solid var(--line);border-radius:12px;resize:vertical}
.resitem{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;color:var(--ink);font:inherit}
.resitem:hover{border-color:var(--pri)}
.resitem span{color:var(--mute);font-size:.9rem}
.sheet{position:fixed;inset:0;background:rgba(36,27,75,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheetbox{background:#fff;width:100%;max-width:760px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.sheetbox h3{margin:0 0 10px}
.sheetbtn{display:block;width:100%;text-align:left;background:#f7f5ff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font:inherit;font-weight:600;color:var(--ink)}
.subrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.subrow:last-child{border:0}
.reader p{margin:.6em 0;font-size:1.05rem}
.reader h3{margin:1.1em 0 .2em;color:var(--pri)}
body.lrs{font-family:Verdana,"Trebuchet MS",Tahoma,sans-serif;letter-spacing:.04em;word-spacing:.14em;line-height:1.75;--bg:#fbf4de}
body.lrs .q{font-size:1.5rem;line-height:1.8}body.lrs .choice,body.lrs .btn{font-size:1.15rem}body.lrs .card{background:#fffdf5}
.clz{font-size:1.15rem;background:#f5f3ff;border-radius:12px;padding:10px 12px;margin:8px 0}
.switch{display:flex;align-items:center;gap:10px;padding:10px 0;font-weight:700}.switch input{width:22px;height:22px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs"></nav>
<script>
"use strict";
